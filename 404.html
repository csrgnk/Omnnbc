<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // 1. Get the requested page name
        var segment = window.location.pathname.split('/').pop();
        
        // 2. Try to redirect to /posts/ folder with .html extension
        if (segment && segment !== "" && !segment.includes('.')) {
            window.location.replace("/posts/" + segment + ".html");
        } else {
            // 3. If it's a broken link, send to home
            setTimeout(function() {
                window.location.replace("/");
            }, 3000);
        }
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f6f9; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #C2185B; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header style="color: #C2185B; font-size: 24px; font-weight: bold;">Namo Narayanaya Bhakthi Channel</header>
    <div class="loader"></div>
    <p>Loading your page, please wait...</p>
    <p>If not redirected, <a href="/">click here to go home</a>.</p>
</body>
</html>
