<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Namo Narayanaya Bhakthi Channel</title>

<!-- SEO META -->
<meta name="description" id="metaDesc">
<meta name="keywords" id="metaKeywords">
<meta property="og:title" id="ogTitle">
<meta property="og:description" id="ogDesc">
<meta property="og:url" id="ogUrl">

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
}

/* BODY */
body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:#fffdf0;
}

/* 🔵 MENU */
.top-links{
  background:var(--dark-blue);
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
}
.top-links a{
  color:#fff;
  padding:8px 16px;
  text-decoration:none;
  flex-shrink:0;
}

/* 🔴 MENU */
.outer-links{
  background:var(--primary-pink);
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
}
.outer-links a{
  background:#fff;
  color:var(--primary-pink);
  margin:6px;
  padding:6px 14px;
  border-radius:6px;
  text-decoration:none;
  flex-shrink:0;
}

/* HEADER */
header{
  background:#fff9db;
  padding:10px;
}
.header-box{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo{width:50px;}
.line1,.line2{
  font-size:1.6rem;
  font-weight:900;
  color:var(--primary-pink);
}

/* CONTAINER */
.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

/* BREADCRUMB */
.breadcrumb{
  font-weight:bold;
  margin-bottom:10px;
}

/* TITLE */
.post-title{
  text-align:center;
  font-size:1.6rem;
  font-weight:bold;
  margin-bottom:15px;
}

/* CONTENT */
.post-content{
  background:#fff9db;
  padding:20px;
  border-radius:10px;
}

/* SHARE */
.share-row{
  display:flex;
  gap:8px;
  margin-top:20px;
}
.share-btn{
  flex:1;
  padding:10px;
  color:#fff;
  text-align:center;
  border-radius:6px;
  text-decoration:none;
}
.wa{background:#25D366;}
.fb{background:#1877F2;}
.tw{background:#1DA1F2;}

/* BACK */
.back-home{
  text-align:center;
  margin-top:20px;
}

/* NAV */
.post-nav{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
}

/* RELATED */
#relatedPosts{
  margin-top:20px;
  background:#fff9db;
  padding:10px;
  border-radius:10px;
}
.related-card{
  padding:8px;
  border-bottom:1px solid #eee;
}
.related-card a{
  color:var(--primary-pink);
  text-decoration:none;
  font-weight:bold;
}

/* FOOTER */
footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:12px;
}
</style>
</head>

<body>

<!-- MENU -->
<div class="top-links">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/dmca">DMCA</a>
  <a href="/privacy-policy">Privacy Policy</a>
</div>

<div class="outer-links">
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
</div>

<header>
  <div class="header-box">
    <img src="/assets/images/Omnnbc-new.png" class="logo">
    <div>
      <div class="line1">Namo Narayanaya</div>
      <div class="line2">Bhakthi Channel</div>
    </div>
  </div>
</header>

<div class="container">

<div id="breadcrumb" class="breadcrumb"></div>

<div id="postTitle" class="post-title"></div>

<div id="postContent" class="post-content"></div>

<!-- SHARE -->
<div id="shareRow" class="share-row"></div>

<!-- BACK -->
<div class="back-home">
  <a href="/">← Back to Home</a>
</div>

<!-- PREV NEXT -->
<div id="postNav" class="post-nav"></div>

<!-- RELATED -->
<div id="relatedPosts"></div>

</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
const repoName="Omnnbc";
const baseUrl=location.hostname.includes("github.io")?"/"+repoName:"";
let slug=location.pathname.replace(baseUrl,"").replace(/^\/|\/$/g,"");

/* SEO */
function setSEO(post){
  let keyword=post.title.toLowerCase().split(" ").slice(0,4).join(" ");
  let desc=post.description||post.title;

  document.title=post.title;
  metaDesc.content=desc;
  metaKeywords.content=keyword;

  ogTitle.content=post.title;
  ogDesc.content=desc;
  ogUrl.content=location.href;
}

/* LOAD PAGE FIRST */
fetch(baseUrl+"/pages/"+slug+".html")
.then(r=>{
  if(r.ok) return r.text();
  throw "no page";
})
.then(html=>{
  setContent(slug.replace(/-/g," "),html);
})
.catch(()=>loadPost());

/* LOAD POST */
function loadPost(){
  fetch(baseUrl+"/data/posts.json")
  .then(r=>r.json())
  .then(posts=>{
    let index=posts.findIndex(p=>p.url===slug);

    if(index!==-1){
      let post=posts[index];

      fetch(baseUrl+"/posts/"+slug+".html")
      .then(r=>r.text())
      .then(html=>{
        postTitle.innerText=post.title;

        /* SEO */
        setSEO(post);

        breadcrumb.innerHTML=`Omnnbc > Posts > ${post.title}`;

        let temp=document.createElement("div");
        temp.innerHTML=html;
        temp.querySelectorAll("header,footer,nav").forEach(e=>e.remove());
        postContent.innerHTML=temp.innerHTML;

        /* SHARE */
        let url=encodeURIComponent(location.href);
        let text=encodeURIComponent(post.title+"\n\n");

        shareRow.innerHTML=`
          <a href="https://api.whatsapp.com/send?text=${text}${url}" class="share-btn wa">WhatsApp</a>
          <a href="https://facebook.com/sharer/sharer.php?u=${url}" class="share-btn fb">Facebook</a>
          <a href="https://twitter.com/intent/tweet?text=${text}&url=${url}" class="share-btn tw">Twitter</a>
        `;

        /* PREV NEXT */
        let prev=posts[index-1];
        let next=posts[index+1];
        postNav.innerHTML=`
          ${prev?`<a href="${baseUrl}/${prev.url}">← ${prev.title}</a>`:""}
          ${next?`<a href="${baseUrl}/${next.url}">${next.title} →</a>`:""}
        `;

        /* RELATED */
        let related=posts.filter(p=>p.url!==slug).slice(0,5);
        let relHTML="<h3>Related Posts</h3>";
        related.forEach(r=>{
          relHTML+=`<div class="related-card"><a href="${baseUrl}/${r.url}">${r.title}</a></div>`;
        });
        relatedPosts.innerHTML=relHTML;

      });
    }else{
      show404();
    }
  });
}

/* SET PAGE CONTENT */
function setContent(title,html){
  postTitle.innerText=title;
  breadcrumb.innerHTML=`Omnnbc > ${title}`;

  let temp=document.createElement("div");
  temp.innerHTML=html;
  temp.querySelectorAll("header,footer,nav").forEach(e=>e.remove());

  postContent.innerHTML=temp.innerHTML;
}

/* 404 */
function show404(){
  postTitle.innerText="404 - Not Found";
  postContent.innerHTML="Page not found";
}
</script>

</body>
</html>
