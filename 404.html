<script>
const repoName = "Omnnbc";
const isGitHub = location.hostname.includes("github.io");
// This ensures baseUrl is empty on omnnbc.com but "/Omnnbc" on GitHub
const baseUrl = isGitHub ? "/" + repoName : "";

// Get the slug (e.g., "hanuman-chalisa") from the URL
let slug = location.pathname.replace(baseUrl, "").replace(/^\/|\/$/g, "");

// Function to copy URL
function copyUrl() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    alert("Link copied!");
  });
}

/* LOAD DATA */
fetch(baseUrl + "/data/posts.json?v=" + Date.now())
  .then(r => r.json())
  .then(posts => {
    // Find the post in your JSON list
    let index = posts.findIndex(p => p.url === slug || p.url === slug.replace(".html", ""));

    if (index !== -1) {
      let post = posts[index];
      let cleanSlug = post.url; // Use the exact URL from JSON

      // Update Page Title and Breadcrumb
      document.title = post.title;
      document.getElementById("breadcrumb").innerHTML = `Home > Posts > ${post.title}`;
      document.getElementById("postTitle").innerText = post.title;

      /* FETCH THE ACTUAL POST CONTENT */
      // Crucial: This looks inside the /posts/ folder for the .html file
      fetch(`${baseUrl}/posts/${cleanSlug}.html`)
        .then(r => {
          if (!r.ok) throw new Error("File not found in /posts/ folder");
          return r.text();
        })
        .then(html => {
          let temp = document.createElement("div");
          temp.innerHTML = html;
          
          // Remove extra headers/footers if they exist inside the post file
          temp.querySelectorAll("header,footer,nav,script,style").forEach(e => e.remove());
          
          document.getElementById("postContent").innerHTML = temp.innerHTML;

          /* SHARE BUTTONS */
          let shareUrl = encodeURIComponent(window.location.href);
          let shareTitle = encodeURIComponent(post.title + "\n\n");
          document.getElementById("shareRow").innerHTML = `
            <a href="https://api.whatsapp.com/send?text=${shareTitle}${shareUrl}" class="share-btn wa" target="_blank">WhatsApp</a>
            <a href="https://facebook.com/sharer/sharer.php?u=${shareUrl}" class="share-btn fb" target="_blank">Facebook</a>
            <a href="https://twitter.com/intent/tweet?text=${shareTitle}&url=${shareUrl}" class="share-btn tw" target="_blank">Twitter</a>
            <button onclick="copyUrl()" class="share-btn copy-btn">Copy Link</button>
          `;

          /* LEFT & RIGHT NAVIGATION (INTERNAL LINKS) */
          let prev = posts[index + 1]; 
          let next = posts[index - 1]; 
          
          // Note: We link to baseUrl + /slug so the 404 logic catches it
          document.getElementById("postNav").innerHTML = `
            <div class="nav-item">
              ${prev ? `<span class="nav-label">← Previous</span><a href="${baseUrl}/${prev.url}">${prev.title}</a>` : ""}
            </div>
            <div class="nav-item nav-next">
              ${next ? `<span class="nav-label">Next →</span><a href="${baseUrl}/${next.url}">${next.title}</a>` : ""}
            </div>
          `;

          /* RELATED POSTS (RANDOM 5) */
          let related = posts.filter(p => p.url !== cleanSlug).sort(() => 0.5 - Math.random()).slice(0, 5);
          if(related.length > 0) {
              document.getElementById("relatedSection").style.display = "block";
              let relHtml = "";
              related.forEach(r => {
                  relHtml += `<div class="related-item"><a href="${baseUrl}/${r.url}">${r.title}</a></div>`;
              });
              document.getElementById("relatedList").innerHTML = relHtml;
          }
        })
        .catch(err => {
          console.error(err);
          show404("Content file missing in /posts/ folder.");
        });
    } else {
      show404("Post not found in posts.json.");
    }
  }).catch(() => show404("Error loading database."));

function show404(msg) {
  document.getElementById("postTitle").innerText = "404 - Not Found";
  document.getElementById("postContent").innerHTML = `<p style="text-align:center;">క్షమించండి, ఈ పేజీ అందుబాటులో లేదు.<br><small>${msg}</small></p>`;
}
</script>
