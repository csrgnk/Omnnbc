<!DOCTYPE html>
<html lang="te">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="pageTitle">Loading...</title>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:#f4f6f9;
}

header{
background:#fff9db;
padding:20px;
text-align:center;
font-size:1.6rem;
font-weight:bold;
color:#C2185B;
border-bottom:3px solid #FFD700;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
background:white;
margin-top:20px;
border-radius:12px;
}

</style>

</head>

<body>

<header>Namo Narayanaya Bhakthi Channel</header>

<div class="container">

<h1 id="postTitle">Loading...</h1>

<div id="postContent"></div>

</div>

<script>

const repo = window.location.hostname.includes("github.io") ? "/Omnnbc" : "";

const path = window.location.pathname;

const slug = path.split('/').filter(Boolean).pop();

if(!slug){

window.location.href = repo + "/";

}

fetch(`${repo}/data/posts.json`)
.then(r=>r.json())
.then(posts=>{

const post=posts.find(p=>p.url===slug);

if(post){

document.title=post.title+" - Namo Narayanaya";

document.getElementById("postTitle").innerText=post.title;

fetch(`${repo}/posts/${slug}.html`)
.then(r=>r.text())
.then(html=>{

const temp=document.createElement("div");

temp.innerHTML=html;

const extras=temp.querySelectorAll("header,footer,nav,script,style");

extras.forEach(e=>e.remove());

document.getElementById("postContent").innerHTML=temp.innerHTML;

});

}else{

document.getElementById("postTitle").innerText="Page Not Found";

}

});

</script>

</body>
</html>
