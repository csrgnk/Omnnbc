<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
  --light-yellow:#FFFDE7;
}

/* BODY */
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--light-yellow);
}

/* 🔵 TOP MENU */
.top-links{
  background:var(--dark-blue);
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
}
.top-links a{
  color:#fff;
  padding:8px 16px;
  text-decoration:none;
  flex-shrink:0;
  font-weight:600;
}

/* 🔴 SECOND MENU */
.outer-links{
  background:var(--primary-pink);
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
}
.outer-links a{
  background:#fff;
  color:var(--primary-pink);
  margin:6px;
  padding:6px 14px;
  border-radius:6px;
  text-decoration:none;
  flex-shrink:0;
  font-size:14px;
  font-weight:600;
}

/* HEADER */
header{
  background:#fff9db;
  padding:10px;
}

.header-box{
  display:flex;
  align-items:center;
  gap:10px;
}

/* LOGO */
.logo{
  width:50px;
  height:50px;
  border-radius:50%;
}

/* TITLE */
.title-box{
  display:flex;
  flex-direction:column;
}

.line1,.line2{
  font-size:1.5rem;
  font-weight:900;
  color:var(--primary-pink);
  margin:0;
}

/* CONTENT */
.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.post-title{
  background:var(--primary-pink);
  color:#fff;
  text-align:center;
  padding:12px;
  border-radius:8px;
}

.post-content{
  background:#fff9db;
  padding:20px;
  margin-top:10px;
  border-radius:10px;
}

/* SHARE */
.share-row{
  display:flex;
  gap:8px;
  margin-top:20px;
  flex-wrap:wrap;
}
.share-btn{
  flex:1;
  padding:10px;
  color:#fff;
  text-align:center;
  border-radius:6px;
  text-decoration:none;
  font-weight:bold;
}
.wa{background:#25D366;}
.fb{background:#1877F2;}
.tw{background:#1DA1F2;}
.cp{background:#607D8B;border:none;}

/* BACK */
.back-home{
  text-align:center;
  margin-top:20px;
}
.back-home a{
  color:var(--primary-pink);
  font-weight:bold;
  text-decoration:none;
}

/* FOOTER */
footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:12px;
}
</style>
</head>

<body>

<!-- 🔵 TOP MENU -->
<div class="top-links">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/privacy-policy">Privacy Policy</a>
</div>

<!-- 🔴 SECOND MENU -->
<div class="outer-links">
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
  <a href="https://csrgnk.github.io/manache-shlok/hindi/">Manache Shlok Hindi</a>
</div>

<!-- HEADER -->
<header>
  <div class="header-box">
    <img src="/assets/images/Omnnbc-new.png" class="logo">
    <div class="title-box">
      <div class="line1">Namo Narayanaya</div>
      <div class="line2">Bhakthi Channel</div>
    </div>
  </div>
</header>

<!-- CONTENT -->
<div class="container">
  <div id="postTitle" class="post-title">Loading...</div>
  <div id="postContent" class="post-content"></div>

  <!-- SHARE -->
  <div class="share-row" id="shareRow" style="display:none;">
    <a id="sWA" class="share-btn wa" target="_blank">WhatsApp</a>
    <a id="sFB" class="share-btn fb" target="_blank">Facebook</a>
    <a id="sTW" class="share-btn tw" target="_blank">Twitter</a>
    <button onclick="copyURL()" class="share-btn cp">Copy Link</button>
  </div>

  <!-- BACK -->
  <div class="back-home">
    <a href="/">← Back to Home</a>
  </div>
</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

let slug=location.pathname.replace(baseUrl,"").replace(/^\/|\/$/g,"");

function copyURL(){
  navigator.clipboard.writeText(location.href);
  alert("Link Copied!");
}

/* LOAD PAGE */
fetch(baseUrl+"/pages/"+slug+".html")
.then(r=>{
  if(r.ok) return r.text();
  throw "no page";
})
.then(html=>{
  setContent(slug.replace(/-/g," "),html);
})
.catch(()=>{
  loadPost();
});

function loadPost(){
  fetch(baseUrl+"/data/posts.json?v="+Date.now())
  .then(r=>r.json())
  .then(posts=>{
    const post=posts.find(p=>p.url===slug);
    if(post){
      fetch(baseUrl+"/posts/"+slug+".html")
      .then(r=>r.text())
      .then(html=>setContent(post.title,html));
    }else{
      show404();
    }
  });
}

function setContent(title,html){
  document.title=title;
  postTitle.innerText=title;

  const temp=document.createElement("div");
  temp.innerHTML=html;
  temp.querySelectorAll("header,footer,nav,script,style").forEach(e=>e.remove());

  postContent.innerHTML=temp.innerHTML;
  setupShare(title);
}

function setupShare(title){
  const url=encodeURIComponent(location.href);
  const text=encodeURIComponent(title+"\n\n");

  sWA.href=`https://api.whatsapp.com/send?text=${text}${url}`;
  sFB.href=`https://www.facebook.com/sharer/sharer.php?u=${url}`;
  sTW.href=`https://twitter.com/intent/tweet?text=${text}&url=${url}`;

  shareRow.style.display="flex";
}

function show404(){
  postTitle.innerText="404 - Not Found";
  postContent.innerHTML="Page not found";
}
</script>

</body>
</html>
