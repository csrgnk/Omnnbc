<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="pageTitle">Namo Narayanaya Bhakthi Channel</title>

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
  --accent-orange:#EF6C00;
  --light-yellow:#FFFDE7;
}

body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:#f1f3f5;
}

/* 🔵 MENU */
.blue-nav{
  background:var(--dark-blue);
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
}
.blue-nav a{
  color:#fff;
  font-size:16px;
  padding:8px 16px;
  text-decoration:none;
  flex-shrink:0;
}

/* 🔴 MENU */
.scroll-container{
  background:var(--primary-pink);
  display:flex;
  overflow-x:auto;
}
.scroll-container a{
  background:#fff;
  color:var(--primary-pink);
  padding:8px 16px;
  margin:6px;
  border-radius:6px;
  text-decoration:none;
  flex-shrink:0;
  font-size:15px;
  font-weight:600;
}

/* HEADER */
.site-header{
  background:#fff9db;
  padding:12px;
  text-align:center;
}
.line1,.line2{
  font-size:1.9rem;
  font-weight:900;
  color:var(--primary-pink);
}

/* CONTENT */
.container{
  max-width:750px;
  margin:auto;
  padding:15px;
}

.post-title{
  background:var(--primary-pink);
  color:#fff;
  text-align:center;
  padding:12px;
  font-size:1.3rem;
  border-radius:8px;
}

.post-content{
  background:var(--light-yellow);
  padding:20px;
  margin-top:15px;
  border-radius:10px;
}

/* SHARE */
.share-row{
  display:flex;
  gap:8px;
  margin-top:20px;
  flex-wrap:wrap;
}
.share-btn{
  flex:1;
  padding:10px;
  border-radius:6px;
  color:#fff;
  text-align:center;
  font-weight:bold;
  text-decoration:none;
}
.wa{background:#25D366;}
.fb{background:#1877F2;}
.tw{background:#1DA1F2;}
.cp{background:#607D8B;border:none;}

/* BACK */
.back-home{
  text-align:center;
  margin:25px 0;
}
.back-home a{
  color:var(--primary-pink);
  border:2px solid var(--primary-pink);
  padding:8px 20px;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
}

footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:12px;
}
</style>
</head>

<body>

<!-- 🔵 MENU -->
<nav class="blue-nav">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/dmca">DMCA</a>
  <a href="/privacy-policy">Privacy Policy</a>
</nav>

<!-- 🔴 MENU -->
<div class="scroll-container">
  <a href="/">Home</a>
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
  <a href="https://csrgnk.github.io/manache-shlok/hindi/">Manache Shlok Hindi</a>
</div>

<!-- HEADER -->
<header class="site-header">
  <div class="line1">Namo Narayanaya</div>
  <div class="line2">Bhakthi Channel</div>
</header>

<!-- CONTENT -->
<div class="container">
  <div id="postTitle" class="post-title">Loading...</div>
  <div id="postContent" class="post-content"></div>

  <!-- SHARE -->
  <div class="share-row" id="shareRow" style="display:none;">
    <a id="sWA" class="share-btn wa" target="_blank">WhatsApp</a>
    <a id="sFB" class="share-btn fb" target="_blank">Facebook</a>
    <a id="sTW" class="share-btn tw" target="_blank">Twitter</a>
    <button onclick="copyURL()" class="share-btn cp">Copy Link</button>
  </div>

  <!-- BACK -->
  <div class="back-home">
    <a href="/">← Back to Home</a>
  </div>
</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

/* GET PATH */
let path = location.pathname.replace(baseUrl,"").replace(/^\/|\/$/g,"");

/* PAGES LIST */
const pages = ["about-us","contact-us","dmca","privacy-policy"];

/* PAGE REDIRECT */
if(pages.includes(path)){
  location.replace(baseUrl + "/" + path + ".html");
}

/* COPY */
function copyURL(){
  navigator.clipboard.writeText(location.href);
  alert("Link Copied!");
}

/* LOAD POST */
fetch(baseUrl+"/data/posts.json?v="+Date.now())
.then(r=>r.json())
.then(posts=>{
  const post = posts.find(p=>p.url===path);

  if(post){
    document.title = post.title;
    document.getElementById("postTitle").innerText = post.title;

    fetch(baseUrl+"/posts/"+path+".html")
    .then(r=>r.text())
    .then(html=>{
      document.getElementById("postContent").innerHTML = html;
      setupShare(post.title);
    });

  } else {
    document.getElementById("postTitle").innerText = "404 - Not Found";
    document.getElementById("postContent").innerHTML = "Page not found";
  }
});

/* SHARE */
function setupShare(title){
  const u=encodeURIComponent(location.href);
  const t=encodeURIComponent(title+"\n\n");

  sWA.href=`https://api.whatsapp.com/send?text=${t}${u}`;
  sFB.href=`https://www.facebook.com/sharer/sharer.php?u=${u}`;
  sTW.href=`https://twitter.com/intent/tweet?text=${t}&url=${u}`;

  document.getElementById("shareRow").style.display="flex";
}
</script>

</body>
</html>
