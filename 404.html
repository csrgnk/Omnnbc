<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Loading...</title>
    <script type="text/javascript">
        // 1. Get the post name from the URL
        var path = window.location.pathname;
        var segment = path.split('/').filter(Boolean).pop();

        // 2. Redirect to the real file in the posts folder
        if (segment && !path.includes('.html') && segment !== "posts") {
            window.location.replace("/posts/" + segment + ".html");
        } else {
            // If it's a truly broken link, go to home
            window.location.replace("/");
        }
    </script>
</head>
<body>
    <div style="text-align:center; padding-top:100px; font-family:sans-serif;">
        <h2 style="color:#C2185B;">Namo Narayanaya Bhakthi Channel</h2>
        <p>Opening your devotional post...</p>
    </div>
</body>
</html>
