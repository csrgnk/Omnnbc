<!DOCTYPE html>
<html lang="te">
<head>

<!-- CLEAN URL HANDLING -->
<script>
(function() {
  var path = window.location.pathname;
  if (path !== "/" && !path.endsWith(".html")) {
    var cleanSlug = path.replace(/^\/|\/$/g, "");
    window.history.replaceState(null, "", "/" + cleanSlug);
    window.__slug = cleanSlug;
  }
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>
<meta name="description" content="Telugu devotional stotram content and bhakti articles.">
<meta name="robots" content="index, follow">

<style>
:root{ --primary-pink:#C71585; --dark-blue:#001a4d; --bg-yellow:#fff9db; }
body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#fffdf0; }

.top-links { background: var(--dark-blue); display:flex; overflow-x:auto; }
.top-links a { color:#fff; padding:15px; text-decoration:none; font-weight:bold; }

.container { max-width:850px; margin:auto; padding:15px; }

.post-title { text-align:center; font-size:1.7rem; color:var(--dark-blue); }

.post-content { background:#fff; padding:20px; border-radius:8px; }

footer { background:var(--dark-blue); color:#fff; text-align:center; padding:20px; margin-top:40px; }
</style>

</head>

<body>

<nav class="top-links">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
</nav>

<div class="container">

<!-- ✅ BREADCRUMB -->
<div id="breadcrumbs" style="font-size:14px; margin-bottom:10px;">
  <a href="/">Home</a> › 
  <a id="crumbParent" href="#">Loading...</a> › 
  <span id="crumbCurrent">Loading...</span>
</div>

<h1 id="postTitle" class="post-title">Loading...</h1>

<div id="postContent" class="post-content">
Loading content...
</div>

</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>

const baseUrl = location.origin;

// Slug
let slug = window.__slug || location.pathname.replace(/^\/|\/$/g, "") || "home";

const staticPages = ["about-us", "contact-us", "privacy-policy", "dmca"];

if (staticPages.includes(slug)) {
  loadContent(slug, "pages", slug.replace(/-/g, " ").toUpperCase());
} else {
  fetch(`${baseUrl}/data/posts.json?v=` + Date.now())
  .then(r => r.json())
  .then(posts => {
    let index = posts.findIndex(p => p.url === slug);
    if (index !== -1) {
      loadContent(posts[index].url, "posts", posts[index].title, index, posts);
    } else {
      show404();
    }
  }).catch(() => show404());
}

// LOAD CONTENT
function loadContent(fileSlug, folder, title, index = -1, posts = []) {

  document.title = title;
  document.getElementById("postTitle").innerText = title;

  // ✅ Breadcrumb logic
  let parentName = (folder === "posts") ? "Posts" : "Pages";
  let parentLink = (folder === "posts") ? "/posts/" : "/";

  document.getElementById("crumbParent").innerText = parentName;
  document.getElementById("crumbParent").href = parentLink;
  document.getElementById("crumbCurrent").innerText = title;

  fetch(`${baseUrl}/${folder}/${fileSlug}.html`)
  .then(res => res.text())
  .then(html => {
    document.getElementById("postContent").innerHTML = html;
  })
  .catch(() => show404());
}

// 404
function show404() {
  document.getElementById("postTitle").innerText = "404 - Page Not Found";
  document.getElementById("postContent").innerHTML = "<p>Page not found</p>";
}

</script>

</body>
</html>
