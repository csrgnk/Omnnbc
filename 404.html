<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="pageTitle">Namo Narayanaya Bhakthi Channel</title>

<!-- 🔥 SEO META -->
<meta name="description" id="metaDesc" content="Bhakthi stotrams, Dasabodha, Upasana Chandrika, Manache Shlok Telugu lyrics and more.">
<meta name="keywords" content="Telugu stotrams, bhakthi songs, Dasabodha, Manache Shlok, devotional">
<meta name="author" content="Namo Narayanaya Bhakthi Channel">

<!-- 🔥 OPEN GRAPH (WhatsApp / Facebook) -->
<meta property="og:title" id="ogTitle" content="Namo Narayanaya Bhakthi Channel">
<meta property="og:description" id="ogDesc" content="Devotional Telugu content and stotrams">
<meta property="og:type" content="article">
<meta property="og:url" id="ogUrl" content="">
<meta property="og:image" content="https://yourdomain.com/assets/images/Omnnbc-new.png">

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
  --accent-orange:#EF6C00;
  --light-yellow:#FFFDE7;
}

body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:#f1f3f5;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* 🔵 MENU */
.blue-nav{
  background:var(--dark-blue);
  padding:6px 0;
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
}
.blue-nav a{
  color:#fff;
  font-size:16px;
  padding:6px 16px;
  text-decoration:none;
}

/* 🔴 MENU */
.scroll-container{
  background:var(--primary-pink);
  padding:6px 0;
  display:flex;
  overflow-x:auto;
}
.scroll-container a{
  background:#fff;
  color:var(--primary-pink);
  padding:7px 16px;
  margin:0 6px;
  border-radius:6px;
  text-decoration:none;
  font-size:15px;
  font-weight:600;
}

/* HEADER */
.site-header{
  background:#fff9db;
  padding:10px;
  border-bottom:2px solid #FFD700;
}
.header-box{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
}
.logo{
  width:60px;
  height:60px;
  border-radius:50%;
}
.title-box{
  text-align:center;
}
.line1,.line2{
  font-size:1.9rem;
  font-weight:900;
  color:var(--primary-pink);
}

/* CONTENT */
.container{
  max-width:750px;
  margin:auto;
  padding:15px;
  flex:1;
}
.post-title-box{
  background:var(--primary-pink);
  color:#fff;
  text-align:center;
  padding:12px;
  font-size:1.4rem;
  border-radius:8px;
}
.post-content{
  background:var(--light-yellow);
  padding:20px;
  margin-top:15px;
  border-radius:10px;
}

/* FOOTER */
footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:15px;
}
</style>
</head>

<body>

<nav class="blue-nav">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/dmca">DMCA</a>
  <a href="/privacy-policy">Privacy Policy</a>
</nav>

<div class="scroll-container">
  <a href="/">Home</a>
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
  <a href="https://csrgnk.github.io/manache-shlok/hindi/">Manache Shlok Hindi</a>
</div>

<header class="site-header">
  <div class="header-box">
    <img id="logoImg" class="logo">
    <div class="title-box">
      <div class="line1">Namo Narayanaya</div>
      <div class="line2">Bhakthi Channel</div>
    </div>
  </div>
</header>

<div class="container">
  <div id="postTitle" class="post-title-box">Loading...</div>
  <div id="postContent" class="post-content"></div>
</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

/* LOGO */
document.getElementById("logoImg").src = baseUrl + "/assets/images/Omnnbc-new.png";

/* GET SLUG */
let slug = location.pathname.replace(baseUrl,"").replace(/^\/|\/$/g,"");

/* HOME redirect */
if(slug==="" || slug==="index.html"){
  location.href = baseUrl + "/";
}

/* LOAD POSTS */
fetch(baseUrl+"/data/posts.json?v="+Date.now())
.then(r=>r.json())
.then(posts=>{
  const post=posts.find(p=>p.url===slug);

  if(post){
    // 🔥 SEO SET
    document.title = post.title;
    document.getElementById("metaDesc").content = post.description || "";
    document.getElementById("ogTitle").content = post.title;
    document.getElementById("ogDesc").content = post.description || "";
    document.getElementById("ogUrl").content = location.href;

    document.getElementById("postTitle").innerText=post.title;

    fetch(baseUrl+"/posts/"+slug+".html")
    .then(r=>r.text())
    .then(html=>{
      document.getElementById("postContent").innerHTML=html;
    });

  } else {
    document.getElementById("postTitle").innerText="404 - Not Found";
    document.getElementById("postContent").innerHTML="Page not found";
  }
});
</script>

</body>
</html>
