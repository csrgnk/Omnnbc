```html
<!DOCTYPE html>
<html lang="te">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Namo Narayanaya Bhakthi Channel</title>

<!-- SEO AUTO META -->
<meta name="description" content="Bhakthi content, spiritual posts, Telugu devotional knowledge.">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:type" content="article">
<meta property="og:url" content="">
<meta property="og:image" content="/assets/images/Omnnbc-new.png">

<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', function(e){
 if(e.ctrlKey && ['c','u','s','a','p'].includes(e.key)) e.preventDefault();
});
document.onselectstart=()=>false;
</script>

<style>
:root{
 --primary-pink:#C71585;
 --dark-blue:#001a4d;
 --bg-yellow:#fff9db;
}

body{margin:0;font-family:'Segoe UI',Arial;background:#fffdf0;}

.container{max-width:800px;margin:auto;padding:15px;}
.post-content{background:#fff;padding:20px;border-radius:10px;}

.share-buttons{
 display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;
}
.share-buttons a,.share-buttons button{
 padding:10px 14px;border-radius:20px;color:#fff;text-decoration:none;border:none;
}
#waShare{background:#25D366;}
#fbShare{background:#1877F2;}
#twShare{background:#000;}
#tgShare{background:#0088cc;}
#igShare{background:#E1306C;}
.copyBtn{background:var(--primary-pink);}

img{max-width:100%;height:auto;border-radius:8px;}

footer{background:var(--dark-blue);color:#fff;text-align:center;padding:20px;}
</style>

</head>

<body>

<div class="container">

<h1 id="postTitle"></h1>
<div id="postContent">Loading...</div>

<!-- SHARE -->
<div id="shareSection" style="display:none;">
<h3 style="text-align:center;color:var(--dark-blue)">Share this Post</h3>
<div class="share-buttons">
<a id="waShare" target="_blank">WhatsApp</a>
<a id="fbShare" target="_blank">Facebook</a>
<a id="twShare" target="_blank">Twitter</a>
<a id="tgShare" target="_blank">Telegram</a>
<button id="igShare">Instagram</button>
<button class="copyBtn" onclick="copyLink()">Copy Link</button>
</div>
</div>

<div id="postNav"></div>

</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

let slug=location.pathname.replace(baseUrl,"").replace(/^\/|\/$/g,"")||"home";

fetch(baseUrl+"/data/posts.json?v="+Date.now())
.then(r=>r.json())
.then(posts=>{
 posts.sort((a,b)=>new Date(b.date)-new Date(a.date));

 let i=posts.findIndex(p=>p.url===slug);
 if(i!==-1){
  loadPost(posts[i],i,posts);
 }else show404();
});

function loadPost(post,index,posts){
 document.title=post.title;
 document.getElementById("postTitle").innerText=post.title;

 // SEO AUTO
 document.querySelector('meta[name="description"]').setAttribute("content", post.title);
 document.querySelector('meta[property="og:title"]').setAttribute("content", post.title);
 document.querySelector('meta[property="og:description"]').setAttribute("content", post.title);
 document.querySelector('meta[property="og:url"]').setAttribute("content", location.href);

 fetch(`${baseUrl}/posts/${post.url}.html`)
 .then(r=>r.text())
 .then(html=>{
  let temp=document.createElement("div");
  temp.innerHTML=html;

  // LAZY LOAD IMAGES
  temp.querySelectorAll("img").forEach(img=>{
   img.loading="lazy";
  });

  document.getElementById("postContent").innerHTML=temp.innerHTML;

  document.getElementById("shareSection").style.display="block";
  setupShare(post.title);

  let older=posts[index+1];
  let newer=posts[index-1];

  document.getElementById("postNav").innerHTML=`
   <div>${older?`<a href="${baseUrl}/${older.url}">← ${older.title}</a>`:""}</div>
   <div style="text-align:right">${newer?`<a href="${baseUrl}/${newer.url}">${newer.title} →</a>`:""}</div>`;
 });
}

/* SHARE */
function setupShare(title){
 let url=location.href;
 let text=encodeURIComponent(title+" - "+url);

 waShare.href="https://wa.me/?text="+text;
 fbShare.href="https://www.facebook.com/sharer/sharer.php?u="+url;
 twShare.href="https://twitter.com/intent/tweet?text="+text;
 tgShare.href="https://t.me/share/url?url="+url+"&text="+encodeURIComponent(title);

 // Instagram workaround
 document.getElementById("igShare").onclick=function(){
   navigator.clipboard.writeText(url);
   alert("Link copied! Open Instagram and paste.");
   window.open("https://www.instagram.com/");
 };
}

function copyLink(){
 navigator.clipboard.writeText(location.href);
 alert("Link copied!");
}

/* 404 */
function show404(){
 document.title="404";
 document.getElementById("postContent").innerHTML=`
 <div style="text-align:center;padding:40px">
 <h2 style="font-size:60px;color:#C71585">404</h2>
 <p>క్షమించండి! పేజీ కనుగొనబడలేదు.</p>
 </div>`;
}
</script>

</body>
</html>
```
