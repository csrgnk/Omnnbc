<script>
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

let path=location.pathname.replace(baseUrl,"").replace(/^\/|\/$/g,"");
let slug=path||"home";

const staticPages=["about-us","contact-us","privacy-policy","dmca"];

if(staticPages.includes(slug)){
 loadContent(slug,"pages",slug);
}else{
 fetch(baseUrl+"/data/posts.json?v="+Date.now())
 .then(r=>r.json())
 .then(posts=>{
  posts.sort((a,b)=>new Date(b.date)-new Date(a.date));
  let index=posts.findIndex(p=>p.url===slug);
  if(index!==-1){
   loadContent(posts[index].url,"posts",posts[index].title,index,posts);
  }else show404();
 }).catch(()=>show404());
}

function loadContent(fileSlug,folder,title,index=-1,posts=[]){
 document.title=title;

 document.getElementById("breadcrumb").innerHTML="Home > "+title;
 document.getElementById("postTitle").innerText=title;

 // SEO
 document.querySelector('meta[name="description"]').setAttribute("content",title);
 document.querySelector('meta[property="og:title"]').setAttribute("content",title);
 document.querySelector('meta[property="og:url"]').setAttribute("content",location.href);

 fetch(`${baseUrl}/${folder}/${fileSlug}.html`)
 .then(r=>r.text())
 .then(html=>{
  let temp=document.createElement("div");
  temp.innerHTML=html;

  // LAZY LOAD
  temp.querySelectorAll("img").forEach(img=>img.loading="lazy");

  document.getElementById("postContent").innerHTML=temp.innerHTML;

  if(folder==="posts"){
   document.getElementById("postExtras").style.display="block";
   document.getElementById("shareSection").style.display="block";
   setupShareButtons(title);
   renderNavigation(index,posts);
  }
 })
 .catch(()=>show404());
}

function renderNavigation(index,posts){
 let older=posts[index+1];
 let newer=posts[index-1];

 document.getElementById("postNav").innerHTML=`
 <div>${older?`<a href="${baseUrl}/${older.url}">← ${older.title}</a>`:""}</div>
 <div style="text-align:right">${newer?`<a href="${baseUrl}/${newer.url}">${newer.title} →</a>`:""}</div>
 `;

 let related=posts.filter((_,i)=>i!==index).slice(0,5);
 let html="";
 related.forEach(r=>html+=`<div><a href="${baseUrl}/${r.url}">${r.title}</a></div>`);
 document.getElementById("relatedList").innerHTML=html;
}

/* SHARE */
function setupShareButtons(title){
 let url=location.href;
 let text=encodeURIComponent(title+" - "+url);

 waShare.href="https://wa.me/?text="+text;
 fbShare.href="https://www.facebook.com/sharer/sharer.php?u="+url;
 twShare.href="https://twitter.com/intent/tweet?text="+text;
 tgShare.href="https://t.me/share/url?url="+url+"&text="+encodeURIComponent(title);

 igShare.onclick=function(){
  navigator.clipboard.writeText(url);
  alert("Link copied! Open Instagram and paste.");
  window.open("https://www.instagram.com/");
 };
}

function copyLink(){
 navigator.clipboard.writeText(location.href);
 alert("Link copied!");
}

/* 404 */
function show404(){
 document.title="404";
 document.getElementById("postContent").innerHTML=`
 <div class="error-container">
 <h2 class="error-code">404</h2>
 <p>క్షమించండి! పేజీ కనుగొనబడలేదు.</p>
 </div>`;
}
</script>
