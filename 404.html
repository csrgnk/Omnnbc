<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
  --light-yellow:#FFFDE7;
}

/* BODY */
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--light-yellow);
}

/* MENU */
.top-links{
  background:var(--dark-blue);
  display:flex;
  overflow-x:auto;
}
.top-links a{
  color:#fff;
  padding:8px 16px;
  text-decoration:none;
  flex-shrink:0;
}

/* HEADER */
header{
  background:#fff9db;
  text-align:center;
  padding:12px;
}

/* TITLE */
.line1,.line2{
  font-size:1.8rem;
  font-weight:900;
  color:var(--primary-pink);
}

/* CONTENT */
.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.post-title{
  background:var(--primary-pink);
  color:#fff;
  text-align:center;
  padding:12px;
  border-radius:8px;
}

.post-content{
  background:#fff9db;
  padding:20px;
  margin-top:10px;
  border-radius:10px;
}

/* SHARE */
.share-row{
  display:flex;
  gap:8px;
  margin-top:20px;
  flex-wrap:wrap;
}
.share-btn{
  flex:1;
  padding:10px;
  color:#fff;
  text-align:center;
  border-radius:6px;
  text-decoration:none;
  font-weight:bold;
}
.wa{background:#25D366;}
.fb{background:#1877F2;}
.tw{background:#1DA1F2;}
.cp{background:#607D8B;border:none;}

/* BACK */
.back-home{
  text-align:center;
  margin-top:20px;
}
.back-home a{
  color:var(--primary-pink);
  font-weight:bold;
  text-decoration:none;
}

/* FOOTER */
footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:12px;
}
</style>
</head>

<body>

<!-- MENU -->
<div class="top-links">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/privacy-policy">Privacy Policy</a>
</div>

<!-- HEADER -->
<header>
  <div class="line1">Namo Narayanaya</div>
  <div class="line2">Bhakthi Channel</div>
</header>

<!-- CONTENT -->
<div class="container">
  <div id="postTitle" class="post-title">Loading...</div>
  <div id="postContent" class="post-content"></div>

  <!-- SHARE -->
  <div class="share-row" id="shareRow" style="display:none;">
    <a id="sWA" class="share-btn wa" target="_blank">WhatsApp</a>
    <a id="sFB" class="share-btn fb" target="_blank">Facebook</a>
    <a id="sTW" class="share-btn tw" target="_blank">Twitter</a>
    <button onclick="copyURL()" class="share-btn cp">Copy Link</button>
  </div>

  <!-- BACK -->
  <div class="back-home">
    <a href="/">← Back to Home</a>
  </div>
</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

/* GET SLUG */
let slug=location.pathname.replace(baseUrl,"").replace(/^\/|\/$/g,"");

/* PAGE LIST */
const pages=["about-us","contact-us","dmca","privacy-policy"];

/* PAGE REDIRECT */
if(pages.includes(slug)){
  window.location.href=baseUrl+"/"+slug+".html";
}

/* COPY */
function copyURL(){
  navigator.clipboard.writeText(location.href);
  alert("Link Copied!");
}

/* LOAD POSTS */
fetch(baseUrl+"/data/posts.json?v="+Date.now())
.then(r=>r.json())
.then(posts=>{
  const post=posts.find(p=>p.url===slug);

  if(post){
    document.title=post.title;
    document.getElementById("postTitle").innerText=post.title;

    fetch(baseUrl+"/posts/"+slug+".html")
    .then(r=>r.text())
    .then(html=>{
      document.getElementById("postContent").innerHTML=html;
      setupShare(post.title);
    });

  }else{
    show404();
  }
});

/* SHARE */
function setupShare(title){
  const url=encodeURIComponent(location.href);
  const text=encodeURIComponent(title+"\n\n");

  document.getElementById("sWA").href=`https://api.whatsapp.com/send?text=${text}${url}`;
  document.getElementById("sFB").href=`https://www.facebook.com/sharer/sharer.php?u=${url}`;
  document.getElementById("sTW").href=`https://twitter.com/intent/tweet?text=${text}&url=${url}`;

  document.getElementById("shareRow").style.display="flex";
}

/* 404 */
function show404(){
  document.getElementById("postTitle").innerText="404 - Not Found";
  document.getElementById("postContent").innerHTML="Page not found";
}
</script>

</body>
</html>
