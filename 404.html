<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<meta name="description" id="metaDesc">
<meta name="keywords" id="metaKeywords">
<meta property="og:title" id="ogTitle">
<meta property="og:description" id="ogDesc">
<meta property="og:url" id="ogUrl">

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
}

body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:#fffdf0;
}

/* NAVIGATION */
.top-links, .outer-links { display:flex; overflow-x:auto; white-space:nowrap; }
.top-links { background:var(--dark-blue); }
.top-links a { color:#fff; padding:12px 16px; text-decoration:none; }
.outer-links { background:var(--primary-pink); padding:5px 0; }
.outer-links a { background:#fff; color:var(--primary-pink); margin:5px; padding:8px 14px; border-radius:6px; text-decoration:none; font-weight:bold; }

/* HEADER */
header{ background:#fff9db; padding:15px; border-bottom: 1px solid #ddd; }
.header-box{ display:flex; align-items:center; gap:12px; max-width:800px; margin:auto; }
.logo { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-pink); }
.line1,.line2{ font-size:1.5rem; font-weight:900; color:var(--primary-pink); line-height: 1.2; }

/* CONTAINER */
.container{ max-width:800px; margin:auto; padding:15px; min-height: 60vh; }
.breadcrumb{ font-size: 14px; color: #666; margin-bottom:15px; }
.post-title{ text-align:center; font-size:1.8rem; font-weight:bold; color: var(--dark-blue); margin-bottom:20px; }
.post-content{ background:#fff; padding:25px; border-radius:12px; border: 1px solid #eee; line-height: 1.6; }

/* SHARE BUTTONS */
.share-label { font-weight: bold; margin: 20px 0 10px; color: var(--dark-blue); }
.share-row{ display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; margin-bottom: 20px; }
.share-btn{ padding:12px; color:#fff; text-align:center; border-radius:6px; text-decoration:none; font-weight: bold; font-size: 14px; cursor: pointer; border: none; }
.wa{ background:#25D366; }
.fb{ background:#1877F2; }
.tw{ background:#000000; }
.copy-btn{ background:#607D8B; }

/* PREV NEXT NAVIGATION (Text Setup - Left & Right) */
.post-nav{ display:flex; justify-content:space-between; align-items: flex-start; margin: 30px 0; padding: 20px 0; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; gap: 20px; }
.nav-item { flex: 1; text-decoration: none; color: var(--primary-pink); font-weight: bold; font-size: 15px; }
.nav-next { text-align: right; }
.nav-label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; text-transform: uppercase; }

/* BACK BUTTON */
.back-home-btn { display: inline-block; background: var(--dark-blue); color: white; padding: 12px 25px; border-radius: 25px; text-decoration: none; font-weight: bold; margin: 20px 0; }

footer{ background:var(--dark-blue); color:#fff; text-align:center; padding:20px; margin-top: 40px; }

/* 404 SPECIFIC */
.error-box { text-align: center; padding: 50px 20px; }
</style>
</head>

<body>

<nav class="top-links">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/dmca">DMCA</a>
  <a href="/privacy-policy">Privacy Policy</a>
</nav>

<div class="outer-links">
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
</div>

<header>
  <div class="header-box">
    <img src="/assets/images/Omnnbc-new.png" class="logo">
    <div>
      <div class="line1">Namo Narayanaya</div>
      <div class="line2">Bhakthi Channel</div>
    </div>
  </div>
</header>

<div class="container">
  <div id="breadcrumb" class="breadcrumb"></div>
  <h1 id="postTitle" class="post-title"></h1>
  <div id="postContent" class="post-content">Loading content...</div>

  <div class="share-label">Share this Post:</div>
  <div id="shareRow" class="share-row"></div>

  <div id="postNav" class="post-nav"></div>

  <div style="text-align:center;">
    <a href="/" class="back-home-btn">Go to Homepage</a>
  </div>
</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
const repoName = "Omnnbc";
const isGitHub = location.hostname.includes("github.io");
const baseUrl = isGitHub ? "/" + repoName : "";
let slug = location.pathname.replace(baseUrl, "").replace(/^\/|\/$/g, "");

function copyUrl() {
  const el = document.createElement('textarea');
  el.value = window.location.href;
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
  alert("Link copied to clipboard!");
}

/* SEO */
function setSEO(post) {
  document.title = post.title;
  metaDesc.content = post.description || post.title;
  ogTitle.content = post.title;
  ogUrl.content = location.href;
}

/* LOAD CONTENT */
fetch(baseUrl + "/data/posts.json")
  .then(r => r.json())
  .then(posts => {
    let index = posts.findIndex(p => p.url === slug);

    if (index !== -1) {
      let post = posts[index];
      setSEO(post);
      breadcrumb.innerHTML = `Home > Posts > ${post.title}`;
      postTitle.innerText = post.title;

      fetch(`${baseUrl}/posts/${slug}.html`)
        .then(r => r.text())
        .then(html => {
          let temp = document.createElement("div");
          temp.innerHTML = html;
          // Clean the HTML to only show the post body
          temp.querySelectorAll("header,footer,nav,script,style").forEach(e => e.remove());
          postContent.innerHTML = temp.innerHTML;

          /* SHARE BUTTONS WITH TITLE & URL */
          let shareUrl = encodeURIComponent(window.location.href);
          let shareTitle = encodeURIComponent(post.title + "\n\n");

          shareRow.innerHTML = `
            <a href="https://api.whatsapp.com/send?text=${shareTitle}${shareUrl}" class="share-btn wa" target="_blank">WhatsApp</a>
            <a href="https://facebook.com/sharer/sharer.php?u=${shareUrl}" class="share-btn fb" target="_blank">Facebook</a>
            <a href="https://twitter.com/intent/tweet?text=${shareTitle}&url=${shareUrl}" class="share-btn tw" target="_blank">Twitter</a>
            <button onclick="copyUrl()" class="share-btn copy-btn">Copy Link</button>
          `;

          /* PREV & NEXT TEXT LINKS */
          let prev = posts[index + 1]; // Older post
          let next = posts[index - 1]; // Newer post

          postNav.innerHTML = `
            <div class="nav-item">
              ${prev ? `<span class="nav-label">← Previous</span><a href="${baseUrl}/${prev.url}" style="color:var(--primary-pink); text-decoration:none;">${prev.title}</a>` : ""}
            </div>
            <div class="nav-item nav-next">
              ${next ? `<span class="nav-label">Next →</span><a href="${baseUrl}/${next.url}" style="color:var(--primary-pink); text-decoration:none;">${next.title}</a>` : ""}
            </div>
          `;
        });
    } else {
      show404();
    }
  }).catch(() => show404());

function show404() {
  postTitle.innerText = "404 - Page Not Found";
  postContent.innerHTML = `<div class="error-box">క్షమించండి, మీరు వెతుకుతున్న పేజీ అందుబాటులో లేదు.<br><br>The page you are looking for might have been removed or renamed.</div>`;
  breadcrumb.innerHTML = "Home > 404 Error";
}
</script>

</body>
</html>
