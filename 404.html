<!DOCTYPE html>
<html lang="te">
<head>

<!-- CLEAN URL HANDLING -->
<script>
(function() {
  var path = window.location.pathname;

  if (path !== "/" && !path.endsWith(".html")) {
    var cleanSlug = path.replace(/^\/|\/$/g, "");
    window.history.replaceState(null, "", "/" + cleanSlug);
    window.__slug = cleanSlug;
  }
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<meta name="description" content="Telugu devotional stotram content and bhakti articles">
<meta name="robots" content="index, follow">

<style>
:root{ --primary-pink:#C71585; --dark-blue:#001a4d; }
body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#fffdf0; }

.top-links { background:#001a4d; display:flex; overflow-x:auto; }
.top-links a { color:#fff; padding:15px; text-decoration:none; font-weight:bold; }

.container { max-width:850px; margin:auto; padding:15px; }
.post-title { text-align:center; font-size:1.7rem; color:#001a4d; }
.post-content { background:#fff; padding:20px; border-radius:8px; }

.share-section { margin-top:20px; text-align:center; }
.share-btn { padding:10px 15px; border-radius:20px; color:#fff; text-decoration:none; font-size:12px; font-weight:bold; margin:5px; display:inline-block; }

footer { background:#001a4d; color:#fff; text-align:center; padding:20px; margin-top:40px; }
</style>
</head>

<body>

<nav class="top-links">
  <a href="/">Home</a>
  <a href="/about-us">About</a>
  <a href="/contact-us">Contact</a>
</nav>

<div class="container">
  <h1 id="postTitle" class="post-title">Loading...</h1>

  <div id="postContent" class="post-content">
    <h2>Loading devotional content...</h2>
    <p>Please wait...</p>
  </div>

  <noscript>
    <h2>Devotional Content</h2>
    <p>This page contains Telugu stotram content.</p>
  </noscript>

  <div id="shareSection" class="share-section" style="display:none;">
    <h3>Share this page</h3>
    <div id="shareButtons"></div>
  </div>
</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>

const baseUrl = location.origin;

// CLEAN SLUG
let slug = window.__slug || location.pathname.replace(/^\/|\/$/g, "") || "home";

// LOAD POSTS
fetch(`${baseUrl}/data/posts.json?v=` + Date.now())
.then(r => r.json())
.then(posts => {
    let post = posts.find(p => p.url === slug);
    if (post) {
        loadContent(post.url, post.title);
    } else {
        show404();
    }
})
.catch(() => show404());

// LOAD CONTENT
function loadContent(fileSlug, title) {
    document.title = title;
    document.getElementById("postTitle").innerText = title;

    fetch(`${baseUrl}/posts/${fileSlug}.html`)
    .then(r => r.text())
    .then(html => {
        document.getElementById("postContent").innerHTML = html;
        document.getElementById("shareSection").style.display = "block";
        setupShare(title);
    })
    .catch(() => show404());
}

// SHARE BUTTONS (UPDATED)
function setupShare(title) {
    let url = encodeURIComponent(window.location.origin + "/" + slug);
    let text = encodeURIComponent(title);

    document.getElementById("shareButtons").innerHTML = `
        <a href="https://wa.me/?text=${text}%20${url}" target="_blank" class="share-btn" style="background:#25D366">WhatsApp</a>

        <a href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank" class="share-btn" style="background:#1877F2">Facebook</a>

        <a href="https://twitter.com/intent/tweet?text=${text}&url=${url}" target="_blank" class="share-btn" style="background:#1DA1F2">Twitter</a>

        <button onclick="copyLink()" class="share-btn" style="background:#607d8b;border:none;">Copy Link</button>
    `;
}

// COPY LINK
function copyLink() {
    let link = window.location.origin + "/" + slug;
    navigator.clipboard.writeText(link);
    alert("Link Copied!");
}

// 404
function show404() {
    document.getElementById("postTitle").innerText = "404 - Page Not Found";
    document.getElementById("postContent").innerHTML = "<p>Page not found</p><a href='/'>Go Home</a>";
}

</script>

</body>
</html>
