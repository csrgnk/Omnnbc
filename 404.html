<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>
<meta name="description" content="Telugu devotional stotram content and bhakti articles.">
<meta name="robots" content="index, follow">

<script>
(function() {
  var path = window.location.pathname;
  var cleanSlug = path.replace(/^\/|\/$/g, "").replace(".html", "").replace("posts/", "");
  var canonicalUrl = window.location.origin + "/" + cleanSlug;

  var link = document.createElement('link');
  link.setAttribute('rel', 'canonical');
  link.setAttribute('href', canonicalUrl);
  document.head.appendChild(link);

  if (path.includes('/posts/') || path.endsWith('.html')) {
    window.location.replace(window.location.origin + "/" + cleanSlug);
  }

  if (path !== "/" && !path.endsWith(".html")) {
    window.history.replaceState(null, "", "/" + cleanSlug);
    window.__slug = cleanSlug;
  }
})();
</script>

<style>
  :root{ --primary-pink:#C71585; --dark-blue:#001a4d; --bg-yellow:#fff9db; }
  body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#fffdf0; color:#333; line-height:1.6; }
  .top-links { background: var(--dark-blue); display: flex; overflow-x: auto; white-space: nowrap; }
  .top-links a { color:#fff; padding:15px 20px; text-decoration:none; font-size: 14px; font-weight: bold; }
  .outer-links { background: var(--primary-pink); display: flex; overflow-x: auto; white-space: nowrap; padding: 5px 0; }
  .outer-links a { background:#fff; color:var(--primary-pink); margin:5px; padding:8px 15px; border-radius:20px; text-decoration:none; font-weight:bold; font-size:12px; }
  header { background: var(--bg-yellow); padding: 15px 5px; border-bottom: 2px solid var(--primary-pink); text-align: center; }
  .header-box { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .logo { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--primary-pink); }
  .line1, .line2 { color: var(--primary-pink); font-size: 1.6rem; font-weight: 900; margin: 0; }
  .container { max-width: 850px; margin: auto; padding: 15px; min-height: 70vh; }
  .post-title { text-align: center; font-size: 1.7rem; color: var(--dark-blue); margin-bottom: 20px; font-weight: 800; }
  .post-content { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; min-height: 200px; font-size: 1.1rem; }
  .share-section { margin-top: 30px; text-align: center; background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; }
  .share-buttons { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .share-btn { padding: 10px 18px; border-radius: 20px; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; border: none; cursor: pointer; }
  .nav-link { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; text-decoration: none; color: var(--primary-pink); font-weight: bold; text-align: center; flex: 1; }
  footer { background: var(--dark-blue); color: #fff; text-align: center; padding: 25px; margin-top: 40px; }
</style>
</head>

<body>
<header>
  <div class="header-box">
    <img src="/assets/images/Omnnbc-new.png" class="logo" alt="Logo">
    <div><div class="line1">Namo Narayanaya</div><div class="line2">Bhakthi Channel</div></div>
  </div>
</header>

<div class="container">
  <h1 id="postTitle" class="post-title">Loading...</h1>
  <div id="postContent" class="post-content">Preparing content for search engine...</div>

  <div id="shareSection" class="share-section" style="display:none;">
    <p style="font-weight:bold; color:var(--dark-blue);">Share this Post</p>
    <div id="shareButtons" class="share-buttons"></div>
  </div>

  <div id="postNav" style="display: flex; gap: 10px; margin-top: 20px;"></div>
</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
  async function startApp() {
    const currentBase = window.location.origin;
    let slug = window.__slug || window.location.pathname.replace(/^\/|\/$/g, "").replace(".html", "") || "home";

    try {
      // 1. Fetch JSON first
      const resJson = await fetch(`${currentBase}/data/posts.json?v=${Date.now()}`);
      const posts = await resJson.json();
      const index = posts.findIndex(p => p.url === slug);

      if (index !== -1) {
        const post = posts[index];
        document.title = post.title + " | Namo Narayanaya";
        document.getElementById("postTitle").innerText = post.title;

        // 2. Fetch HTML Content
        const resHtml = await fetch(`${currentBase}/posts/${post.url}.html?v=${Date.now()}`);
        const htmlBody = await resHtml.text();
        
        // Inject into DOM immediately
        document.getElementById("postContent").innerHTML = htmlBody;
        
        // Setup UI
        document.getElementById("shareSection").style.display = "block";
        setupShare(post.title, slug);
        setupNav(index, posts);
      } else {
        document.getElementById("postContent").innerHTML = "Page not found.";
      }
    } catch (err) {
        document.getElementById("postContent").innerHTML = "Error loading content.";
    }
  }

  function setupShare(title, slug) {
    let url = encodeURIComponent(window.location.origin + "/" + slug);
    let text = encodeURIComponent(title);
    document.getElementById("shareButtons").innerHTML = `
      <a href="https://wa.me/?text=${text}%20${url}" target="_blank" class="share-btn" style="background:#25D366">WhatsApp</a>
      <a href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank" class="share-btn" style="background:#1877F2">Facebook</a>
      <a href="https://twitter.com/intent/tweet?text=${text}&url=${url}" target="_blank" class="share-btn" style="background:#1DA1F2">Twitter</a>
      <button onclick="navigator.clipboard.writeText(window.location.href)" class="share-btn" style="background:#607d8b;">Copy Link</button>`;
  }

  function setupNav(index, posts) {
    let newer = posts[index - 1], older = posts[index + 1], navHtml = "";
    if (newer) navHtml += `<a href="/${newer.url}" class="nav-link">← ${newer.title}</a>`;
    if (older) navHtml += `<a href="/${older.url}" class="nav-link">${older.title} →</a>`;
    document.getElementById("postNav").innerHTML = navHtml;
  }

  // బాట్ కోసం వేచి ఉండకుండా వెంటనే రన్ చేయడం
  window.addEventListener('DOMContentLoaded', startApp);
</script>
</body>
</html>
