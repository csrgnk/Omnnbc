<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Namo Narayanaya Bhakthi Channel</title>

<!-- ✅ SEO META -->
<meta name="description" id="metaDesc">
<meta name="keywords" id="metaKeywords">
<meta property="og:title" id="ogTitle">
<meta property="og:description" id="ogDesc">
<meta property="og:url" id="ogUrl">

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
}

/* BODY */
body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:#fffdf0;
}

/* MENU */
.top-links{
  background:var(--dark-blue);
  display:flex;
  overflow-x:auto;
}
.top-links a{
  color:#fff;
  padding:8px 16px;
  text-decoration:none;
}

/* SECOND MENU */
.outer-links{
  background:var(--primary-pink);
  display:flex;
  overflow-x:auto;
}
.outer-links a{
  background:#fff;
  color:var(--primary-pink);
  margin:6px;
  padding:6px 14px;
  border-radius:6px;
  text-decoration:none;
}

/* HEADER */
header{
  background:#fff9db;
  padding:10px;
}
.header-box{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo{
  width:50px;
  height:50px;
  border-radius:50%;
}
.line1,.line2{
  font-size:1.6rem;
  font-weight:900;
  color:var(--primary-pink);
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

/* BREADCRUMB */
.breadcrumb{
  font-size:14px;
  margin-bottom:10px;
}
.breadcrumb a{
  color:var(--primary-pink);
}

/* TITLE */
.post-title{
  font-size:1.6rem;
  font-weight:bold;
}

/* LAYOUT */
.main-layout{
  display:flex;
  gap:20px;
}
.left-content{flex:2;}
.right-sidebar{flex:1;}

/* CONTENT */
.post-content{
  background:#fff9db;
  padding:20px;
  border-radius:10px;
}

/* RELATED */
#relatedPosts{
  background:#fff9db;
  padding:10px;
  border-radius:10px;
}
.related-card{
  padding:8px;
  border-bottom:1px solid #eee;
}
.related-card a{
  color:var(--primary-pink);
  font-weight:bold;
  text-decoration:none;
}

/* NAV */
.post-nav{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
}

/* SHARE */
.share-row{
  display:flex;
  gap:8px;
  margin-top:20px;
}
.share-btn{
  flex:1;
  padding:10px;
  color:#fff;
  text-align:center;
  border-radius:6px;
}
.wa{background:#25D366;}
.fb{background:#1877F2;}
.tw{background:#1DA1F2;}
.cp{background:#607D8B;}

/* BACK */
.back-home{
  text-align:center;
  margin-top:20px;
}

/* SCROLL */
#topBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#C71585;
  color:#fff;
  border:none;
  padding:10px;
  border-radius:50%;
  display:none;
}

/* MOBILE */
@media(max-width:768px){
  .main-layout{flex-direction:column;}
}

footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:12px;
}
</style>
</head>

<body>

<!-- MENU -->
<div class="top-links">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
</div>

<div class="outer-links">
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
</div>

<header>
  <div class="header-box">
    <img src="/assets/images/Omnnbc-new.png" class="logo">
    <div>
      <div class="line1">Namo Narayanaya</div>
      <div class="line2">Bhakthi Channel</div>
    </div>
  </div>
</header>

<div class="container">

<div id="breadcrumb" class="breadcrumb"></div>
<div id="postTitle" class="post-title"></div>

<div class="main-layout">

  <div class="left-content">
    <div id="postContent" class="post-content"></div>
    <div id="postNav" class="post-nav"></div>
  </div>

  <div class="right-sidebar">
    <div id="relatedPosts"></div>
  </div>

</div>

<div class="share-row" id="shareRow" style="display:none;">
  <a id="sWA" class="share-btn wa">WhatsApp</a>
  <a id="sFB" class="share-btn fb">Facebook</a>
  <a id="sTW" class="share-btn tw">Twitter</a>
  <button onclick="copyURL()" class="share-btn cp">Copy</button>
</div>

<div class="back-home">
  <a href="/">← Back to Home</a>
</div>

</div>

<button id="topBtn">↑</button>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

let slug=location.pathname.replace(baseUrl,"").replace(/^\/|\/$/g,"");

/* SEO FUNCTION */
function setSEO(post){
  let keyword = post.title.toLowerCase().split(" ").slice(0,4).join(" ");

  document.title = post.title;
  metaDesc.content = post.description || post.title;
  metaKeywords.content = keyword;

  ogTitle.content = post.title;
  ogDesc.content = post.description || post.title;
  ogUrl.content = location.href;
}

/* LOAD POSTS */
fetch(baseUrl+"/data/posts.json")
.then(r=>r.json())
.then(posts=>{
  let index=posts.findIndex(p=>p.url===slug);

  if(index!==-1){
    let post=posts[index];

    fetch(baseUrl+"/posts/"+slug+".html")
    .then(r=>r.text())
    .then(html=>{
      postTitle.innerText=post.title;

      /* SEO */
      setSEO(post);

      breadcrumb.innerHTML=`<a href="/">Omnnbc</a> > Posts > ${post.title}`;

      let temp=document.createElement("div");
      temp.innerHTML=html;
      temp.querySelectorAll("header,footer,nav").forEach(e=>e.remove());
      postContent.innerHTML=temp.innerHTML;

      /* RELATED */
      let related=posts.filter(p=>p.url!==slug).slice(0,5);
      let relHTML="<h3>Related Posts</h3>";
      related.forEach(r=>{
        relHTML+=`<div class="related-card"><a href="${baseUrl}/${r.url}">${r.title}</a></div>`;
      });
      relatedPosts.innerHTML=relHTML;

      /* NAV */
      let prev=posts[index-1];
      let next=posts[index+1];
      postNav.innerHTML=`
        ${prev?`<a href="${baseUrl}/${prev.url}">← ${prev.title}</a>`:""}
        ${next?`<a href="${baseUrl}/${next.url}">${next.title} →</a>`:""}
      `;

      setupShare(post.title);
    });
  }
});

/* SHARE */
function setupShare(title){
  let url=encodeURIComponent(location.href);
  let text=encodeURIComponent(title+"\n\n");

  sWA.href=`https://api.whatsapp.com/send?text=${text}${url}`;
  sFB.href=`https://www.facebook.com/sharer/sharer.php?u=${url}`;
  sTW.href=`https://twitter.com/intent/tweet?text=${text}&url=${url}`;

  shareRow.style.display="flex";
}

/* COPY */
function copyURL(){
  navigator.clipboard.writeText(location.href);
  alert("Copied");
}

/* SCROLL */
window.onscroll=()=>{
  topBtn.style.display=document.documentElement.scrollTop>200?"block":"none";
};
topBtn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
</script>

</body>
</html>
