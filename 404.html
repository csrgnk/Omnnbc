<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Namo Narayanaya Bhakthi Channel</title>

<style>
:root {
    --primary-pink:#C71585;
    --dark-blue:#001a4d;
    --accent-orange:#EF6C00;
    --light-yellow:#FFFDE7;
}
body{
    margin:0;
    font-family:'Segoe UI',Arial;
    background:#f1f3f5;
    display:flex;
    flex-direction:column;
    min-height:100vh;
}
header{
    background:#fff9db;
    padding:12px;
    text-align:center;
    color:var(--primary-pink);
    border-bottom:2px solid #FFD700;
}
.container{
    max-width:750px;
    margin:auto;
    padding:15px;
    flex:1;
}
.post-title-box{
    background:var(--primary-pink);
    color:#fff;
    padding:12px;
    text-align:center;
    border-radius:8px;
    font-weight:bold;
}
.post-content{
    background:var(--light-yellow);
    padding:20px;
    border-radius:10px;
    margin-top:15px;
    line-height:1.8;
}
footer{
    background:var(--dark-blue);
    color:#fff;
    text-align:center;
    padding:12px;
}
</style>
</head>

<body>

<header>
    <h2>Namo Narayanaya Bhakthi Channel</h2>
</header>

<div class="container">
    <div class="post-title-box" id="postTitle">Loading...</div>
    <div class="post-content" id="postContent"></div>
</div>

<footer>
© 2026 Namo Narayanaya Bhakthi Channel
</footer>

<script>
const repoName = "Omnnbc";
const isGitHub = location.hostname.includes("github.io");
const baseUrl = isGitHub ? "/" + repoName : "";

// 🔥 GET SLUG
let path = location.pathname.replace(baseUrl,"");

if(path.startsWith("/")) path = path.slice(1);
if(path.endsWith(".html")) path = path.replace(".html","");

let slug = path;

// HOME redirect
if(slug === ""){
    location.href = baseUrl + "/";
}

// 🔥 LOAD PAGES FIRST
fetch(baseUrl + "/data/pages.json")
.then(r=>r.json())
.then(pages=>{

    const page = pages.find(p=>p.id === slug);

    if(page){
        document.getElementById("pageTitle").innerText = page.title;
        document.getElementById("postTitle").innerText = page.title;

        fetch(baseUrl + "/pages/" + page.file + ".html")
        .then(r=>r.text())
        .then(html=>render(html))
        .catch(()=>show404());

    } else {

        // 🔥 LOAD POSTS
        fetch(baseUrl + "/data/posts.json")
        .then(r=>r.json())
        .then(posts=>{

            const post = posts.find(p=>p.url === slug);

            if(post){
                document.getElementById("pageTitle").innerText = post.title;
                document.getElementById("postTitle").innerText = post.title;

                fetch(baseUrl + "/posts/" + slug + ".html")
                .then(r=>r.text())
                .then(html=>render(html))
                .catch(()=>show404());

            } else {
                show404();
            }

        })
        .catch(()=>show404());

    }

})
.catch(()=>show404());

function render(html){
    const temp = document.createElement("div");
    temp.innerHTML = html;

    const remove = temp.querySelectorAll("header,footer,nav,script,style");
    remove.forEach(e=>e.remove());

    document.getElementById("postContent").innerHTML = temp.innerHTML;
}

function show404(){
    document.getElementById("pageTitle").innerText="404";
    document.getElementById("postTitle").innerText="Page Not Found";
    document.getElementById("postContent").innerHTML=`
    <div style="text-align:center;">
        <h3>Page Not Found</h3>
        <p>క్షమించండి, ఈ పేజీ అందుబాటులో లేదు</p>
        <a href="${baseUrl}/" style="color:#EF6C00;font-weight:bold;">Go Home</a>
    </div>`;
}
</script>

</body>
</html>
