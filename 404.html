<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Get the requested page name from URL
        var path = window.location.pathname;
        var segment = path.split('/').filter(Boolean).pop();
        
        // If not already in /posts/, redirect there with .html extension
        if (segment && !path.includes('/posts/')) {
            window.location.replace("/posts/" + segment + ".html");
        } else if (path === "/" || path === "/index.html") {
            // Safety check for home
        } else {
            // If the link is totally wrong, go to home after 2 seconds
            setTimeout(function() {
                window.location.replace("/");
            }, 2000);
        }
    </script>
</head>
<body style="text-align:center; padding:50px; font-family:sans-serif; background:#f4f6f9;">
    <h2 style="color:#C2185B;">Namo Narayanaya Bhakthi Channel</h2>
    <div style="border: 4px solid #f3f3f3; border-top: 4px solid #C2185B; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto;"></div>
    <p>Loading your content, please wait...</p>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
</body>
</html>
