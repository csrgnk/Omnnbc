<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Loading Content... - Namo Narayanaya</title>
    <style>
        :root {
            --primary-pink: #C71585;
            --dark-blue: #001a4d;
            --accent-orange: #EF6C00;
            --light-yellow: #FFFDE7;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #f1f3f5; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        /* --- DARK BLUE TOP MENU (Scrollable) --- */
        .blue-nav {
            background-color: var(--dark-blue);
            padding: 6px 0;
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .blue-nav::-webkit-scrollbar { display: none; }
        .blue-nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            padding: 4px 15px;
            flex-shrink: 0;
        }

        /* --- PINK SCROLL MENU --- */
        .scroll-container {
            background-color: var(--primary-pink);
            padding: 6px 0;
            overflow-x: auto;
            display: flex;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .scroll-container::-webkit-scrollbar { display: none; }
        .scroll-container a {
            background-color: #FFFFFF;
            color: var(--primary-pink);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 4px 12px;
            margin: 0 5px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* --- HEADER (Two Lines Centered) --- */
        header { 
            background: #fff9db; 
            padding: 12px 10px; 
            text-align: center; 
            color: var(--primary-pink); 
            border-bottom: 2px solid #FFD700; 
            line-height: 1.1;
        }
        header .line1, header .line2 {
            display: block;
            font-size: 1.4rem;
            font-weight: bold;
        }

        /* --- CONTENT AREA --- */
        .container { 
            max-width: 750px; 
            margin: auto; 
            padding: 15px; 
            flex: 1; 
            width: 100%; 
            box-sizing: border-box; 
        }

        .post-title-box { 
            background: var(--primary-pink); 
            color: white; 
            text-align: center; 
            padding: 12px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            border-radius: 8px; 
            margin-bottom: 15px; 
        }

        .post-content { 
            background: var(--light-yellow); 
            padding: 20px; 
            border-radius: 10px; 
            color: var(--dark-blue); 
            line-height: 1.8; 
            font-size: 20px; 
            border-left: 5px solid var(--primary-pink);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            min-height: 250px;
        }

        .share-row { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-top: 20px; 
        }
        .share-btn { 
            padding: 10px 20px; 
            border-radius: 5px; 
            color: white; 
            font-weight: bold; 
            text-decoration: none; 
            font-size: 13px; 
        }
        .wa { background: #25D366; } 
        .fb { background: #1877F2; } 

        .back-home { text-align: center; margin: 30px 0; }
        .back-home a { 
            color: var(--primary-pink); 
            font-weight: bold; 
            text-decoration: none; 
            padding: 8px 20px;
            border: 2px solid var(--primary-pink);
            border-radius: 25px;
        }

        footer { 
            background: var(--dark-blue); 
            color: white; 
            text-align: center; 
            padding: 15px; 
            font-size: 12px;
        }
    </style>
</head>
<body>

<nav class="blue-nav">
    <a href="https://omnnbc.in/about-us">About Us</a>
    <a href="https://omnnbc.in/contact-us">Contact Us</a>
    <a href="https://omnnbc.in/dmca">DMCA</a>
    <a href="https://omnnbc.in/privacy-policy">Privacy Policy</a>
</nav>

<div class="scroll-container">
    <a href="https://omnnbc.in/">Home</a>
    <a href="https://omnnbc.in/Dasabodha/">Dasabodha</a>
    <a href="https://omnnbc.in/Upasana-Chandrika/">Upasana Chandrika</a>
</div>

<header>
    <span class="line1">Namo Narayanaya</span>
    <span class="line2">Bhakthi Channel</span>
</header>

<div class="container">
    <div class="post-title-box" id="postTitle">Loading...</div>
    <div id="postContent" class="post-content">
        </div>

    <div class="share-row" id="shareRow" style="display:none;">
        <a id="sWA" class="share-btn wa" target="_blank">WhatsApp</a>
        <a id="sFB" class="share-btn fb" target="_blank">Facebook</a>
    </div>

    <div class="back-home">
        <a href="https://omnnbc.in/">← Back to Home</a>
    </div>
</div>

<footer>
    <p>© 2026 Namo Narayanaya Bhakthi Channel</p>
</footer>

<script>
    // Configuration for custom domain omnnbc.in
    const baseUrl = ""; 

    let path = window.location.pathname;
    let slug = path.split('/').filter(p => p).pop();
    if(slug) slug = slug.replace('.html', '');

    const staticPages = ['about-us', 'contact-us', 'dmca', 'privacy-policy'];

    if (slug && staticPages.includes(slug)) {
        // --- HANDLE STATIC PAGES (Files moved from pages/ to root/) ---
        const pageTitle = slug.replace('-', ' ').toUpperCase();
        document.getElementById("postTitle").innerText = pageTitle;

        fetch(`${baseUrl}/${slug}.html`)
        .then(r => { if(!r.ok) throw new Error(); return r.text(); })
        .then(html => renderCleanContent(html))
        .catch(() => show404());
    } else if (slug) {
        // --- HANDLE DYNAMIC POSTS ---
        fetch(`${baseUrl}/data/posts.json`)
        .then(r => r.json())
        .then(posts => {
            const post = posts.find(p => p.url === slug);
            if(post) {
                document.getElementById("pageTitle").innerText = post.title;
                document.getElementById("postTitle").innerText = post.title;
                fetch(`${baseUrl}/posts/${slug}.html`)
                .then(r => r.text())
                .then(html => {
                    renderCleanContent(html);
                    setupSocialShare(post.title);
                });
            } else {
                show404();
            }
        })
        .catch(() => show404());
    } else {
        show404();
    }

    function renderCleanContent(html) {
        const temp = document.createElement("div");
        temp.innerHTML = html;
        const extras = temp.querySelectorAll("header,footer,nav,script,style");
        extras.forEach(e => e.remove());
        document.getElementById("postContent").innerHTML = temp.innerHTML;
    }

    function setupSocialShare(title) {
        const u = encodeURIComponent(window.location.href);
        const m = encodeURIComponent(title + "\n\n");
        document.getElementById("sWA").href = `https://api.whatsapp.com/send?text=${m}${u}`;
        document.getElementById("sFB").href = `https://www.facebook.com/sharer/sharer.php?u=${u}`;
        document.getElementById("shareRow").style.display = "flex";
    }

    function show404() {
        document.getElementById("pageTitle").innerText = "404 - Not Found";
        document.getElementById("postTitle").innerText = "404 - Page Not Found";
        document.getElementById("postContent").innerHTML = `
            <div style="text-align:center; padding: 20px;">
                <h2 style="color:var(--primary-pink);">క్షమించండి, ఈ పేజీ అందుబాటులో లేదు.</h2>
                <p>The page you are looking for has been moved or the URL is incorrect.</p>
                <a href="https://omnnbc.in/" style="color:var(--accent-orange); font-weight:bold; text-decoration:none;">మళ్ళీ ప్రయత్నించండి →</a>
            </div>`;
    }
</script>

</body>
</html>
