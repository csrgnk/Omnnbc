<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // 1. Get the path segment (e.g., 'sri-rama-ashtottara-shatanamavali')
        var path = window.location.pathname;
        var segment = path.split('/').filter(Boolean).pop();
        
        // 2. If it's not a folder or a direct file, route to /posts/
        if (segment && !path.includes('/posts/') && !segment.includes('.')) {
            window.location.replace("/posts/" + segment + ".html");
        } else if (path === "/" || path === "/index.html") {
            window.location.replace("/");
        } else {
            // 3. Fallback: If page not found in /posts/, show home after delay
            setTimeout(function() {
                window.location.replace("/");
            }, 3000);
        }
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 100px 20px; background: #f4f6f9; color: #C2185B; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #C2185B; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>Namo Narayanaya Bhakthi Channel</h2>
    <div class="spinner"></div>
    <p>Loading your page, please wait...</p>
</body>
</html>
