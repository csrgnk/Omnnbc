name: Automated Sitemap Update

on:
  push:
    branches:
      - main  # Make sure this matches your default branch name (main or master)
    paths:
      - 'data/pages.json'
      - 'data/posts.json'
      - 'generate-sitemap.js'
  workflow_dispatch: # Allows you to run this manually from the "Actions" tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential for the bot to save the file back to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Sitemap Generator
        run: node generate-sitemap.js

      - name: Commit and Push Updated Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: automated sitemap update [skip ci]" || echo "No changes to commit"
          git push
