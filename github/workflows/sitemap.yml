name: Auto Sitemap Update

on:
  push:
    branches: [ main ] # Change to 'master' if that is your branch name

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Run Auto-Scanner
        run: node generate-sitemap.js

      - name: Save and Push Sitemap
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add sitemap.xml
          git commit -m "Automated sitemap update from folder scan" || echo "No changes"
          git push
