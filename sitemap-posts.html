<script>
async function generatePostsSitemap() {

  const domain = "https://omnnbc.com";

  // 👉 Your JSON URL
  const response = await fetch("https://raw.githubusercontent.com/USERNAME/REPO/main/posts.json");
  const posts = await response.json();

  let xml = `<?xml version="1.0" encoding="UTF-8"?> 
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">`;

  posts.forEach(post => {

    // ✅ Convert slug → full URL
    const fullUrl = domain + "/" + post.url;

    // ✅ Format date (remove time)
    const date = post.publish_date.split("T")[0];

    xml += `
  <url>
    <loc>${fullUrl}</loc>
    <lastmod>${date}</lastmod>
    <changefreq>daily</changefreq>
    <priority>0.9</priority>
  </url>`;
  });

  xml += `
</urlset>`;

  document.write(xml);
}

generatePostsSitemap();
</script>
