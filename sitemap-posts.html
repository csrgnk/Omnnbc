<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sitemap Posts</title>
</head>
<body>

<script>
async function generateSitemap() {

  const domain = "https://omnnbc.com";

  // 👉 REPLACE with your GitHub JSON URL
  const response = await fetch("https://raw.githubusercontent.com/USERNAME/REPO/main/posts.json");
  const posts = await response.json();

  let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
  xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

  posts.forEach(post => {
    const fullUrl = domain + "/" + post.url;
    const date = post.publish_date.split("T")[0];

    xml += `
  <url>
    <loc>${fullUrl}</loc>
    <lastmod>${date}</lastmod>
    <changefreq>daily</changefreq>
    <priority>0.9</priority>
  </url>`;
  });

  xml += `\n</urlset>`;

  // ✅ Clear page and print pure XML
  document.open();
  document.write(xml);
  document.close();
}

generateSitemap();
</script>

</body>
</html>
