<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
  --accent-orange:#EF6C00;
}

body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:#f1f3f5;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* 🔵 TOP MENU */
.blue-nav{
  background:var(--dark-blue);
  padding:6px 0;
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
}
.blue-nav a{
  color:#fff;
  text-decoration:none;
  font-size:16px; /* 🔥 increased */
  padding:6px 16px;
  font-weight:500;
}

/* 🔴 PINK MENU */
.scroll-container{
  background:var(--primary-pink);
  padding:6px 0;
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
  scrollbar-width:none;
}
.scroll-container::-webkit-scrollbar{display:none;}

.scroll-container a{
  background:#fff;
  color:var(--primary-pink);
  text-decoration:none;
  font-size:15px; /* 🔥 increased */
  padding:7px 16px;
  margin:0 6px;
  border-radius:6px;
  white-space:nowrap;
  flex-shrink:0;
  font-weight:600;
}

/* HEADER */
.site-header{
  background:#fff9db;
  padding:10px;
  border-bottom:2px solid #FFD700;
}

.header-box{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.logo{
  width:58px;
  height:58px;
  border-radius:50%;
}

.title-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  line-height:1.1;
}

.line1,
.line2{
  font-size:2rem; /* 🔥 BIGGER TITLE */
  font-weight:900;
  color:var(--primary-pink);
  white-space:nowrap;
  margin:0;
}

/* MOBILE */
@media(max-width:600px){
  .line1,
  .line2{
    font-size:1.4rem;
  }
}

/* 🔍 SEARCH */
.search-box{
  text-align:center;
  margin:10px 0;
}

#searchInput{
  width:80%;
  max-width:280px;
  padding:8px;
  border-radius:20px;
  border:2px solid var(--primary-pink);
  font-size:14px;
  text-align:center;
}

/* POSTS */
.container{
  max-width:700px;
  margin:auto;
  padding:10px;
  flex:1;
}

.post-card{
  background:#FFFDE7;
  padding:14px;
  margin-bottom:12px;
  border-radius:8px;
  border-left:5px solid var(--primary-pink);
}

.post-card h2{
  margin:0;
  font-size:1.15rem;
}

.post-meta-desc{
  font-size:14px;
  margin:6px 0;
}

/* PAGINATION */
.pagination-wrapper{
  display:flex;
  justify-content:center;
  padding:20px 10px;
}

.page-numbers-container{
  display:flex;
  overflow-x:auto;
  gap:10px;
}

.pg-btn{
  min-width:42px;
  height:42px;
  border-radius:50%;
  border:2px solid var(--primary-pink);
  background:#fff;
  color:var(--primary-pink);
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.pg-btn.active{
  background:var(--primary-pink);
  color:#fff;
}

footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:12px;
}
</style>
</head>

<body>

<!-- 🔵 TOP MENU -->
<nav class="blue-nav">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/dmca">DMCA</a>
  <a href="/privacy-policy">Privacy Policy</a>
</nav>

<!-- 🔴 PINK MENU -->
<div class="scroll-container">
  <a href="/">Home</a>
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
  <a href="https://csrgnk.github.io/manache-shlok/hindi/">Manache Shlok Hindi</a>
</div>

<!-- HEADER -->
<header class="site-header">
  <div class="header-box">
    <img id="logoImg" class="logo">
    <div class="title-box">
      <span class="line1">Namo Narayanaya</span>
      <span class="line2">Bhakthi Channel</span>
    </div>
  </div>
</header>

<!-- SEARCH -->
<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search stotrams...">
</div>

<!-- POSTS -->
<div class="container" id="postsContainer">Loading...</div>
<div class="pagination-wrapper" id="paginationWrapper"></div>

<footer>
© 2026 Namo Narayanaya Bhakthi Channel
</footer>

<script>
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

/* LOGO */
document.getElementById("logoImg").src = baseUrl + "/assets/images/Omnnbc-new.png";

let allPosts=[];
let filteredPosts=[];
let currentPage=1;
const postsPerPage=25;

fetch(baseUrl+"/data/posts.json?v="+Date.now())
.then(r=>r.json())
.then(data=>{
  allPosts=data.sort((a,b)=>new Date(b.publish_date)-new Date(a.publish_date));
  filteredPosts=[...allPosts];
  renderPage();
});

/* SEARCH */
document.getElementById("searchInput").addEventListener("input",(e)=>{
  const val=e.target.value.toLowerCase();
  filteredPosts=allPosts.filter(p=>p.title.toLowerCase().includes(val));
  currentPage=1;
  renderPage();
});

function renderPage(){
  const container=document.getElementById("postsContainer");
  container.innerHTML="";

  const start=(currentPage-1)*postsPerPage;
  const items=filteredPosts.slice(start,start+postsPerPage);

  items.forEach(post=>{
    const slug=post.url;
    const desc=(post.description||"").substring(0,180);

    const card=document.createElement("div");
    card.className="post-card";

    card.innerHTML=`
      <h2>
        <a href="${baseUrl}/${slug}" style="text-decoration:none;color:inherit;">
          ${post.title}
        </a>
      </h2>
      <div class="post-meta-desc">${desc}...</div>
      <a href="${baseUrl}/${slug}" style="color:var(--accent-orange);font-weight:bold;text-decoration:none;">
        READ MORE →
      </a>
    `;

    container.appendChild(card);
  });

  setupPagination();
}

function setupPagination(){
  const totalPages=Math.ceil(filteredPosts.length/postsPerPage);
  const wrapper=document.getElementById("paginationWrapper");
  wrapper.innerHTML="";

  if(totalPages<=1) return;

  const div=document.createElement("div");
  div.className="page-numbers-container";

  for(let i=1;i<=totalPages;i++){
    const btn=document.createElement("button");
    btn.className="pg-btn"+(i===currentPage?" active":"");
    btn.innerText=i;
    btn.onclick=()=>{currentPage=i;renderPage();};
    div.appendChild(btn);
  }

  wrapper.appendChild(div);
}
</script>

</body>
</html>
