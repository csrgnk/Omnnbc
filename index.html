<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
}

body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:#f1f3f5;
}

/* 🔵 TOP MENU */
.blue-nav{
  background:var(--dark-blue);
  display:flex;
  overflow-x:auto;
  white-space: nowrap;
}
.blue-nav a{
  color:#fff;
  font-size:16px;
  padding:12px 16px;
  text-decoration:none;
  flex-shrink:0;
}

/* 🔴 SECOND MENU */
.scroll-container{
  background:var(--primary-pink);
  display:flex;
  overflow-x:auto;
  padding:5px 0;
}
.scroll-container a{
  background:#fff;
  color:var(--primary-pink);
  padding:8px 16px;
  margin:6px;
  border-radius:6px;
  text-decoration:none;
  flex-shrink:0;
  font-weight:600;
  font-size: 14px;
}

/* HEADER */
.site-header{
  background:#fff9db;
  padding:15px;
  border-bottom: 2px solid #eee;
}
.header-box{
  display:flex;
  align-items:center;
  gap:15px;
  max-width: 700px;
  margin: auto;
}
.logo{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit: cover;
  border: 2px solid var(--primary-pink);
}
.line1,.line2{
  font-size:1.5rem;
  font-weight:900;
  color:var(--primary-pink);
  line-height: 1.2;
}

/* SEARCH */
.search-box{
  text-align:center;
  margin:20px 0;
  position: relative;
}
#searchInput{
  width:85%;
  max-width:400px;
  padding:12px 20px;
  border-radius:25px;
  border:2px solid var(--primary-pink);
  font-size: 16px;
  outline: none;
}
#suggestBox{
  max-width:400px;
  margin:5px auto;
  background:#fff;
  border-radius:8px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  position: absolute;
  left: 0;
  right: 0;
  z-index: 100;
}
#suggestBox div{
  padding:10px 15px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  text-align: left;
}
#suggestBox div:hover{
  background: #f8f9fa;
}

/* POSTS */
.container{
  max-width:700px;
  margin:auto;
  padding:10px;
}
.post-card{
  background:#FFFDE7;
  padding:16px;
  margin-bottom:15px;
  border-radius:10px;
  border-left:6px solid var(--primary-pink);
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  transition: transform 0.2s;
}
.post-card:hover {
  transform: translateY(-2px);
}
.post-link{
  text-decoration:none;
  color:inherit;
  display:block;
}
.post-card h3 {
  margin: 0 0 8px 0;
  color: var(--dark-blue);
}
.desc{
  font-size:14px;
  color: #444;
  line-height: 1.5;
}

/* PAGINATION */
.pagination{
  display:flex;
  overflow-x:auto;
  gap:8px;
  justify-content:center;
  padding:30px 10px;
}
.page-btn{
  min-width:35px;
  height:35px;
  border-radius:5px;
  border:1px solid var(--primary-pink);
  background:#fff;
  color:var(--primary-pink);
  cursor: pointer;
}
.page-btn.active{
  background:var(--primary-pink);
  color:#fff;
}

footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:20px;
  margin-top: 20px;
}
</style>
</head>

<body>

<nav class="blue-nav">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/dmca">DMCA</a>
  <a href="/privacy-policy">Privacy Policy</a>
</nav>

<div class="scroll-container">
  <a href="/">Home</a>
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
  <a href="https://csrgnk.github.io/manache-shlok/hindi/">Manache Shlok Hindi</a>
</div>

<header class="site-header">
  <div class="header-box">
    <img src="assets/images/Omnnbc-new.png" class="logo" alt="Logo">
    <div>
      <div class="line1">Namo Narayanaya</div>
      <div class="line2">Bhakthi Channel</div>
    </div>
  </div>
</header>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search stotrams...">
  <div id="suggestBox"></div>
</div>

<div class="container" id="posts"></div>

<div class="pagination" id="pagination"></div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
const repoName = "Omnnbc";
// Logic to detect if we are on the custom domain or the github.io subfolder
const isGitHubSubfolder = window.location.hostname.includes("github.io") && window.location.pathname.startsWith("/" + repoName);
const baseUrl = isGitHubSubfolder ? "/" + repoName : "";

let allPosts = [], filteredPosts = [];
let currentPage = 1;
const perPage = 25;
let contentCache = {};

const postsContainer = document.getElementById("posts");
const paginationContainer = document.getElementById("pagination");
const suggestBox = document.getElementById("suggestBox");

/* LOAD DATA */
fetch(`${baseUrl}/data/posts.json?v=${Date.now()}`)
  .then(res => {
    if(!res.ok) throw new Error("Could not find posts.json");
    return res.json();
  })
  .then(async data => {
    // Sort by date newest first
    allPosts = data.sort((a,b) => new Date(b.publish_date) - new Date(a.publish_date));
    filteredPosts = [...allPosts];
    
    render();

    // Cache content for deeper search (background)
    allPosts.forEach(async p => {
      try {
        let r = await fetch(`${baseUrl}/posts/${p.url}.html`);
        if(r.ok) {
          let text = await r.text();
          contentCache[p.url] = text.toLowerCase();
        }
      } catch(e) { console.warn("Failed to cache:", p.url); }
    });
  })
  .catch(err => {
    postsContainer.innerHTML = `<p style="text-align:center; color:red;">Error loading posts. Please check if data/posts.json exists.</p>`;
    console.error(err);
  });

/* SEARCH LOGIC */
document.getElementById("searchInput").addEventListener("input", (e) => {
  const val = e.target.value.toLowerCase().trim();
  
  if(!val) {
    filteredPosts = [...allPosts];
    suggestBox.innerHTML = "";
    render();
    return;
  }

  filteredPosts = allPosts.filter(p => 
    p.title.toLowerCase().includes(val) || 
    (p.description || "").toLowerCase().includes(val) ||
    (contentCache[p.url] && contentCache[p.url].includes(val))
  );

  currentPage = 1;
  render(val);
  showSuggestions(filteredPosts.slice(0, 5), val);
});

function showSuggestions(list, term) {
  suggestBox.innerHTML = "";
  list.forEach(p => {
    const div = document.createElement("div");
    div.innerHTML = p.title;
    div.onclick = () => {
        window.location.href = `${baseUrl}/posts/${p.url}.html`;
    };
    suggestBox.appendChild(div);
  });
}

/* RENDERING */
function render(highlightTerm = "") {
  const start = (currentPage - 1) * perPage;
  const end = start + perPage;
  const items = filteredPosts.slice(start, end);

  postsContainer.innerHTML = "";
  
  if(items.length === 0) {
    postsContainer.innerHTML = "<p style='text-align:center;'>No posts found.</p>";
  }

  items.forEach(p => {
    let title = p.title;
    let desc = (p.description || "").substring(0, 150);

    if(highlightTerm) {
      const reg = new RegExp(`(${highlightTerm})`, "gi");
      title = title.replace(reg, `<mark>$1</mark>`);
      desc = desc.replace(reg, `<mark>$1</mark>`);
    }

    postsContainer.innerHTML += `
      <div class="post-card">
        <a href="${baseUrl}/posts/${p.url}.html" class="post-link">
          <h3>${title}</h3>
          <div class="desc">${desc}...</div>
        </a>
      </div>
    `;
  });

  renderPagination();
}

function renderPagination() {
  const totalPages = Math.ceil(filteredPosts.length / perPage);
  paginationContainer.innerHTML = "";
  
  if(totalPages <= 1) return;

  for(let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.innerText = i;
    btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
    btn.onclick = () => {
      currentPage = i;
      render();
      window.scrollTo(0, 0);
    };
    paginationContainer.appendChild(btn);
  }
}
</script>

</body>
</html>
