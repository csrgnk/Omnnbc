<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
  --accent-orange:#EF6C00;
}

body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:#f1f3f5;
}

/* 🔵 MENU */
.blue-nav{
  background:var(--dark-blue);
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
}
.blue-nav a{
  color:#fff;
  font-size:16px;
  padding:8px 16px;
  text-decoration:none;
  flex-shrink:0;
}

/* 🔴 MENU */
.scroll-container{
  background:var(--primary-pink);
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
}
.scroll-container a{
  background:#fff;
  color:var(--primary-pink);
  padding:8px 16px;
  margin:6px;
  border-radius:6px;
  text-decoration:none;
  flex-shrink:0;
  font-size:15px;
  font-weight:600;
}

/* HEADER */
.site-header{
  background:#fff9db;
  padding:12px;
  text-align:center;
}

.line1,
.line2{
  font-size:1.9rem;
  font-weight:900;
  color:var(--primary-pink);
  margin:0;
}

/* POSTS */
.container{
  max-width:700px;
  margin:auto;
  padding:10px;
}

.post-card{
  background:#FFFDE7;
  padding:14px;
  margin-bottom:12px;
  border-radius:8px;
  border-left:5px solid var(--primary-pink);
}

footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:12px;
}
</style>
</head>

<body>

<!-- 🔵 MENU -->
<nav class="blue-nav">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/dmca">DMCA</a>
  <a href="/privacy-policy">Privacy Policy</a>
</nav>

<!-- 🔴 MENU -->
<div class="scroll-container">
  <a href="/">Home</a>
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
  <a href="https://csrgnk.github.io/manache-shlok/hindi/">Manache Shlok Hindi</a>
</div>

<!-- HEADER -->
<header class="site-header">
  <div class="line1">Namo Narayanaya</div>
  <div class="line2">Bhakthi Channel</div>
</header>

<!-- POSTS -->
<div class="container" id="postsContainer">Loading...</div>

<footer>
© 2026 Namo Narayanaya Bhakthi Channel
</footer>

<script>
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

fetch(baseUrl+"/data/posts.json?v="+Date.now())
.then(r=>r.json())
.then(data=>{
  const container=document.getElementById("postsContainer");

  data.forEach(post=>{
    const div=document.createElement("div");
    div.className="post-card";

    div.innerHTML=`
      <h3>
        <a href="${baseUrl}/${post.url}" style="text-decoration:none;color:black;">
          ${post.title}
        </a>
      </h3>
    `;

    container.appendChild(div);
  });
});
</script>

</body>
</html>
