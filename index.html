<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namo Narayanaya Bhakthi Channel</title>
    
    <link rel="icon" type="image/png" href="/assets/images/Omnnbc-new.png">
    <link rel="apple-touch-icon" href="/assets/images/Omnnbc-new.png">

    <meta name="description" content="Discover divine peace with Namo Narayanaya Bhakthi Channel. Explore Dasabodha, Upasana Chandrika, powerful stotrams, and daily prayers to enrich your spiritual journey. Subscribe for daily devotion!">
    <meta name="keywords" content="Stotrams, Telugu Lyrics, Bhakthi, Ramayanam, Namo Narayanaya">
    <link rel="canonical" href="https://omnnbc.com/" />

    <link rel="preconnect" href="https://pagead2.googlesyndication.com">

    <style>
        :root{ --primary-pink:#C71585; --dark-blue:#001a4d; }
        body{ margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#f1f3f5; color: #333; -webkit-user-select: none; user-select: none; font-display: swap; }

        /* Navigation */
        .blue-nav, .scroll-container { display:flex; overflow-x:auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .blue-nav::-webkit-scrollbar, .scroll-container::-webkit-scrollbar { display: none; }
        .blue-nav { background:var(--dark-blue); }
        .blue-nav a { color:#fff; font-size:16px; padding:12px 18px; text-decoration:none; }
        .scroll-container { background:var(--primary-pink); padding:5px 0; }
        .scroll-container a { background:#fff; color:var(--primary-pink); padding:8px 16px; margin:6px; border-radius:6px; text-decoration:none; font-weight:600; font-size: 14px; }

        /* Header */
        .site-header{ background:#fff9db; padding:15px; border-bottom: 2px solid #ddd; }
        .header-box{ display:flex; align-items:center; gap:15px; max-width: 800px; margin: auto; }
        .logo{ width:60px; height:60px; border-radius:50%; object-fit: cover; border: 2px solid var(--primary-pink); }
        .site-name-wrapper h1 { display: flex; flex-direction: row; gap: 8px; margin: 0; font-size: 1.6rem; font-weight: 900; color: var(--primary-pink); }

        @media (max-width: 600px) {
            .site-name-wrapper h1 { flex-direction: column; gap: 0; font-size: 1.3rem; }
        }

        /* Search Box */
        .search-wrapper{ text-align:center; margin:25px 0; }
        #searchInput{ width: 70%; max-width: 320px; padding: 10px 18px; border-radius: 25px; border: 2px solid var(--primary-pink); font-size: 15px; outline: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Posts */
        .container{ max-width:800px; margin:auto; padding:10px; min-height: 600px; contain: content; }
        .post-card{ background:#FFFDE7; padding:18px; margin-bottom:15px; border-radius:12px; border-left:6px solid var(--primary-pink); transition: 0.2s; content-visibility: auto; }
        .post-card h3 { margin: 0 0 8px 0; color: var(--dark-blue); font-size: 1.2rem; }
        .post-link{ text-decoration:none; color:inherit; display: block; }

        /* Pagination */
        .pagination-wrapper { max-width: 800px; margin: 25px auto; overflow-x: auto; display: flex; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 10px 0; }
        .pagination-wrapper::-webkit-scrollbar { display: none; }
        .pagination { display: flex; gap: 8px; margin: 0 auto; padding: 0 15px; }

        .page-btn { min-width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--primary-pink); background: #fff; color: var(--primary-pink); font-weight: bold; cursor: pointer; flex-shrink: 0; transition: 0.2s; }
        .page-btn.active { background: var(--primary-pink); color: #fff; }
        .page-edge { background: var(--primary-pink) !important; color: #fff !important; padding: 0 15px; font-size: 12px; text-transform: uppercase; border: none; }

        footer{ background:var(--dark-blue); color:#fff; text-align:center; padding:25px; margin-top: 30px; }
    </style>
</head>
<body>

<nav class="blue-nav">
    <a href="/">Home</a>
    <a href="/about-us">About Us</a>
    <a href="/contact-us">Contact Us</a>
    <a href="/dmca">DMCA</a>
    <a href="/privacy-policy">Privacy Policy</a>
</nav>

<div class="scroll-container">
    <a href="https://csrgnk.github.io/Dasabodha/" rel="noopener">Dasabodha</a>
    <a href="https://csrgnk.github.io/Upasana-Chandrika/" rel="noopener">Upasana Chandrika</a>
    <a href="https://csrgnk.github.io/manache-shlok/" rel="noopener">Manache Shlok Telugu</a>
</div>

<header class="site-header">
    <div class="header-box">
        <img src="/assets/images/Omnnbc-new.png" class="logo" alt="Logo" width="60" height="60" fetchpriority="high">
        <div class="site-name-wrapper">
            <h1><span>Namo Narayanaya</span> <span>Bhakthi Channel</span></h1>
        </div>
    </div>
</header>

<div class="search-wrapper">
    <input type="text" id="searchInput" placeholder="Search stotrams..." aria-label="Search stotrams">
</div>

<main class="container" id="posts"></main>

<div class="pagination-wrapper">
    <div class="pagination" id="pagination"></div>
</div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            var script = document.createElement('script');
            script.async = true;
            script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7573720131021971";
            script.crossOrigin = "anonymous";
            document.head.appendChild(script);
        }, 3500); 
    });
</script>

<script>
    const repoName = "Omnnbc";
    const isGitHub = location.hostname.includes("github.io");
    const baseUrl = isGitHub ? "/" + repoName : "";

    let allPosts = [], filteredPosts = [];
    let currentPage = 1;
    const perPage = 25;

    // Load data with basic caching
    fetch(`${baseUrl}/data/posts.json`)
    .then(res => res.json())
    .then(data => {
        allPosts = data.sort((a,b) => new Date(b.publish_date) - new Date(a.publish_date));
        filteredPosts = [...allPosts];
        render();
    })
    .catch(err => console.error("Error loading posts:", err));

    function render() {
        const postsDiv = document.getElementById("posts");
        const start = (currentPage - 1) * perPage;
        const items = filteredPosts.slice(start, start + perPage);
        
        const fragment = document.createDocumentFragment();
        postsDiv.innerHTML = "";

        items.forEach(p => {
            const article = document.createElement("article");
            article.className = "post-card";
            article.innerHTML = `
                <a href="${baseUrl}/${p.url}" class="post-link">
                    <h3>${p.title}</h3>
                    <div class="desc">${(p.description || "").substring(0, 120)}...</div>
                </a>`;
            fragment.appendChild(article);
        });
        
        postsDiv.appendChild(fragment);
        setupPagination();
    }

    function setupPagination() {
        const total = Math.ceil(filteredPosts.length / perPage);
        const pagDiv = document.getElementById("pagination");
        pagDiv.innerHTML = "";
        if(total <= 1) return;

        const createBtn = (text, targetPage, isEdge = false) => {
            const btn = document.createElement("button");
            btn.innerText = text;
            btn.className = `page-btn ${isEdge ? 'page-edge' : ''} ${targetPage === currentPage ? 'active' : ''}`;
            btn.onclick = () => { 
                currentPage = targetPage; 
                render(); 
                window.scrollTo({top: 0, behavior: 'smooth'}); 
            };
            return btn;
        };

        pagDiv.appendChild(createBtn("First", 1, true));
        for(let i = 1; i <= total; i++) {
            pagDiv.appendChild(createBtn(i, i));
        }
        pagDiv.appendChild(createBtn("Last", total, true));
    }

    let searchTimer;
    document.getElementById("searchInput").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            const val = e.target.value.toLowerCase().trim();
            currentPage = 1; 
            filteredPosts = allPosts.filter(p => p.title.toLowerCase().includes(val));
            render();
        }, 300);
    });
</script>

</body>
</html>
