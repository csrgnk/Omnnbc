<!DOCTYPE html>
<html lang="te">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dasabodha Grantha Telugu Lyrics</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

header{
background:#fff9db;
padding:20px;
text-align:center;
font-size:1.6rem;
font-weight:bold;
color:#C2185B;
border-bottom:3px solid #FFD700;
}

.container{
max-width:800px;
margin:auto;
padding:15px;
}

.post-card{
background:#FFFDE7;
padding:20px;
margin-bottom:15px;
border-radius:12px;
border-left:6px solid #C2185B;
}

.post-card h2{
margin:0 0 8px;
color:#002366;
}

.pagination-wrapper{
display:flex;
flex-direction:column;
align-items:center;
margin:30px 0;
}

.page-numbers-container{
display:flex;
gap:10px;
overflow-x:auto;
width:100%;
padding:10px;
}

.pg-btn{
min-width:120px;
padding:8px;
border:2px solid #002366;
border-radius:25px;
background:white;
color:#002366;
font-weight:bold;
cursor:pointer;
}

.pg-btn.active{
background:#002366;
color:#FFD700;
}

footer{
background:#C2185B;
color:white;
text-align:center;
padding:20px;
}

</style>

</head>

<body>

<header>
Dasabodha Grantha Telugu Lyrics
</header>

<div class="container" id="postsContainer">
Loading posts...
</div>

<div class="pagination-wrapper">

<p style="font-weight:bold;color:#C2185B;">
Select Dashakam
</p>

<div class="page-numbers-container" id="paginationWrapper"></div>

</div>

<footer>
© 2026 Namo Narayanaya Bhakthi Channel
</footer>

<script>

let allPosts=[];
let currentDashakam=1;

fetch("./data/posts.json?v="+Date.now())

.then(res=>res.json())

.then(data=>{

allPosts=data.sort((a,b)=>{

if(a.dashakam!=b.dashakam){

return a.dashakam-b.dashakam;

}

const numA=parseInt(a.url.match(/samasam-(\d+)/)[1]);
const numB=parseInt(b.url.match(/samasam-(\d+)/)[1]);

return numA-numB;

});

renderPage();

});

function renderPage(){

const container=document.getElementById("postsContainer");

container.innerHTML="";

const posts=allPosts.filter(p=>p.dashakam==currentDashakam);

if(posts.length===0){

container.innerHTML="Posts coming soon for this Dashakam";

setupPagination();

return;

}

posts.forEach(post=>{

const card=document.createElement("div");

card.className="post-card";

card.innerHTML=`

<h2>
<a href="./${post.url}/">
${post.title}
</a>
</h2>

<p>${post.description||""}</p>

<a href="./${post.url}/">
Read Lyrics →
</a>

`;

container.appendChild(card);

});

setupPagination();

}

function setupPagination(){

const wrapper=document.getElementById("paginationWrapper");

wrapper.innerHTML="";

for(let i=1;i<=20;i++){

const btn=document.createElement("button");

btn.className="pg-btn"+(i===currentDashakam?" active":"");

btn.innerText="Dashakam "+i;

btn.onclick=()=>{

currentDashakam=i;

renderPage();

};

wrapper.appendChild(btn);

}

}

</script>

</body>
</html>
