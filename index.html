<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namo Narayanaya Bhakthi Channel</title>
    <style>
        body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background:#f4f6f9; }
        .nav-menu { background: #C2185B; padding: 10px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        header { background:#fff9db; padding:20px; text-align:center; font-size:1.6rem; font-weight:bold; color:#C2185B; border-bottom: 3px solid #FFD700; }
        .search-container { max-width: 800px; margin: 15px auto; padding: 0 15px; }
        #postSearch { width: 100%; padding: 12px 20px; border: 2px solid #C2185B; border-radius: 30px; outline: none; }
        .container { max-width:800px; margin:auto; padding:15px; }
        .post-card { background:#FFFDE7; padding:20px; margin-bottom:15px; border-radius:12px; border-left: 6px solid #C2185B; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        .post-card h2 a { text-decoration: none; color: #002366; }
    </style>
</head>
<body>
<nav class="nav-menu"><a href="/" style="color:white; text-decoration:none; font-weight:bold;">HOME</a></nav>
<header>Namo Narayanaya Bhakthi Channel</header>

<div class="search-container">
    <input type="text" id="postSearch" placeholder="Search 110+ devotional posts...">
</div>

<div class="container" id="postsContainer">Loading...</div>

<script>
    let allPosts = [], filteredPosts = [];

    fetch('/data/posts.json').then(res => res.json()).then(data => {
        allPosts = data.sort((a,b) => new Date(b.publish_date) - new Date(a.publish_date));
        filteredPosts = [...allPosts];
        renderPage();
    });

    function renderPage() {
        const container = document.getElementById("postsContainer");
        container.innerHTML = "";
        filteredPosts.forEach(post => {
            // This turns the long URL into a Clean Slug
            const slug = post.url.split('/').pop().replace('.html', '');
            const card = document.createElement("div");
            card.className = "post-card";
            card.innerHTML = `
                <h2><a href="/${slug}">${post.title}</a></h2>
                <p style="color:#555; font-size:14px;">${post.description || "Read lyrics..."}</p>
                <a href="/${slug}" style="color:#C2185B; font-weight:bold; text-decoration:none;">READ MORE →</a>
            `;
            container.appendChild(card);
        });
    }

    document.getElementById('postSearch').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        filteredPosts = allPosts.filter(p => p.title.toLowerCase().includes(term));
        renderPage();
    });
</script>
</body>
</html>
