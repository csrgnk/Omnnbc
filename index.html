<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<style>
:root{
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
}

body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:#f1f3f5;
}

/* MENU */
.blue-nav{
  background:var(--dark-blue);
  display:flex;
  overflow-x:auto;
}
.blue-nav a{
  color:#fff;
  font-size:16px;
  padding:8px 16px;
  text-decoration:none;
  flex-shrink:0;
}

/* SECOND MENU */
.scroll-container{
  background:var(--primary-pink);
  display:flex;
  overflow-x:auto;
}
.scroll-container a{
  background:#fff;
  color:var(--primary-pink);
  padding:8px 16px;
  margin:6px;
  border-radius:6px;
  text-decoration:none;
  flex-shrink:0;
  font-size:15px;
  font-weight:600;
}

/* HEADER */
.site-header{
  background:#fff9db;
  padding:10px;
}

.header-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:50px;
  height:50px;
  border-radius:50%;
}

.line1,.line2{
  font-size:1.6rem;
  font-weight:900;
  color:var(--primary-pink);
  margin:0;
}

/* POSTS */
.container{
  max-width:700px;
  margin:auto;
  padding:10px;
}

.post-card{
  background:#FFFDE7;
  padding:14px;
  margin-bottom:12px;
  border-radius:8px;
  border-left:5px solid var(--primary-pink);
}

.post-link{
  text-decoration:none;
  color:inherit;
  display:block;
}

.desc{
  font-size:14px;
  margin-top:6px;
}

/* PAGINATION */
.pagination{
  display:flex;
  overflow-x:auto;
  gap:10px;
  justify-content:center;
  padding:20px;
}

.page-btn{
  min-width:40px;
  height:40px;
  border-radius:50%;
  border:2px solid var(--primary-pink);
  background:#fff;
  color:var(--primary-pink);
  font-weight:bold;
  cursor:pointer;
}

.page-btn.active{
  background:var(--primary-pink);
  color:#fff;
}

footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:12px;
}
</style>
</head>

<body>

<nav class="blue-nav">
  <a href="/">Home</a>
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/dmca">DMCA</a>
  <a href="/privacy-policy">Privacy Policy</a>
</nav>

<div class="scroll-container">
  <a href="/">Home</a>
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
</div>

<header class="site-header">
  <div class="header-box">
    <img src="assets/images/Omnnbc-new.png" class="logo">
    <div>
      <div class="line1">Namo Narayanaya</div>
      <div class="line2">Bhakthi Channel</div>
    </div>
  </div>
</header>

<div class="container" id="posts"></div>
<div class="pagination" id="pagination"></div>

<footer>© 2026 Namo Narayanaya Bhakthi Channel</footer>

<script>
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

let posts=[],currentPage=1;
const perPage=25;

fetch(baseUrl+"/data/posts.json?v="+Date.now())
.then(r=>r.json())
.then(data=>{
  posts=data;
  render();
});

function render(){
  const container=document.getElementById("posts");
  container.innerHTML="";

  let start=(currentPage-1)*perPage;
  let items=posts.slice(start,start+perPage);

  items.forEach(p=>{
    let desc=(p.description||"").substring(0,180);

    let div=document.createElement("div");
    div.className="post-card";

    div.innerHTML=`
      <a href="${baseUrl}/${p.url}" class="post-link">
        <h3>${p.title}</h3>
        <div class="desc">${desc}...</div>
      </a>
    `;

    container.appendChild(div);
  });

  setupPagination();
}

function setupPagination(){
  const total=Math.ceil(posts.length/perPage);
  const wrap=document.getElementById("pagination");
  wrap.innerHTML="";

  for(let i=1;i<=total;i++){
    let btn=document.createElement("button");
    btn.className="page-btn"+(i===currentPage?" active":"");
    btn.innerText=i;
    btn.onclick=()=>{currentPage=i;render();};
    wrap.appendChild(btn);
  }
}
</script>

</body>
</html>
