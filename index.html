<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namo Narayanaya Bhakthi Channel</title>
    <style>
        body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background:#f4f6f9; display: flex; flex-direction: column; min-height: 100vh; }
        .nav-menu { background: #C2185B; padding: 10px; text-align: center; position: sticky; top: 0; z-index: 1000; }
        .nav-menu a { color: white; text-decoration: none; margin: 0 10px; font-weight: bold; }
        header { background:#fff9db; padding:20px; text-align:center; font-size:1.6rem; font-weight:bold; color:#C2185B; border-bottom: 3px solid #FFD700; }
        .search-container { max-width: 800px; margin: 15px auto; padding: 0 15px; }
        #postSearch { width: 100%; padding: 12px 20px; border: 2px solid #C2185B; border-radius: 30px; outline: none; box-sizing: border-box; font-size: 16px; }
        .container { max-width:800px; margin:auto; padding:15px; flex: 1; }
        .post-card { background:#FFFDE7; padding:20px; margin-bottom:15px; border-radius:12px; border-left: 6px solid #C2185B; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        .post-card h2 { margin: 0 0 10px 0; font-size: 1.3rem; }
        .post-card h2 a { text-decoration: none; color: #002366; }
        footer { background: #C2185B; color: white; text-align: center; padding: 20px; margin-top: 20px; }
    </style>
</head>
<body>
<nav class="nav-menu"><a href="/" style="color:white; text-decoration:none; font-weight:bold;">HOME</a></nav>
<header>Namo Narayanaya Bhakthi Channel</header>

<div class="search-container">
    <input type="text" id="postSearch" placeholder="Search from 110+ devotional posts...">
</div>

<div class="container" id="postsContainer">Loading posts...</div>

<footer><p>© 2026 Namo Narayanaya Bhakthi Channel</p></footer>

<script>
    let allPosts = [], filteredPosts = [];

    // Fetching the JSON
    fetch('/data/posts.json')
    .then(res => res.json())
    .then(data => {
        allPosts = data.sort((a,b) => new Date(b.publish_date) - new Date(a.publish_date));
        filteredPosts = [...allPosts];
        renderPage();
    });

    function renderPage() {
        const container = document.getElementById("postsContainer");
        container.innerHTML = "";
        
        if(filteredPosts.length === 0) {
            container.innerHTML = "<p style='text-align:center;'>No posts found matching your search.</p>";
            return;
        }

        filteredPosts.forEach(post => {
            // This turns "posts/my-post.html" into "my-post"
            const slug = post.url.split('/').pop().replace('.html', '');
            
            const card = document.createElement("div");
            card.className = "post-card";
            card.innerHTML = `
                <h2><a href="/${slug}">${post.title}</a></h2>
                <p style="color:#555; font-size:14px;">${post.description || "Read devotional lyrics and meanings..."}</p>
                <a href="/${slug}" style="color:#C2185B; font-weight:bold; text-decoration:none; font-size:13px;">READ MORE →</a>
            `;
            container.appendChild(card);
        });
    }

    // Search Logic
    document.getElementById('postSearch').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        filteredPosts = allPosts.filter(p => 
            p.title.toLowerCase().includes(term) || 
            (p.description && p.description.toLowerCase().includes(term))
        );
        renderPage();
    });
</script>
</body>
</html>
