<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<style>
  :root {
    --primary-pink: #C71585;
    --primary-blue: #002366;
    --accent-orange: #FF9800;
    --light-yellow: #FFFDE7;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f4f6f9;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* --- BLUE TOP NAVIGATION --- */
  .blue-nav {
    background-color: var(--primary-blue);
    padding: 10px 0;
    overflow-x: auto;
    display: flex;
    justify-content: center;
    white-space: nowrap;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .blue-nav a {
    color: #ffffff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 5px 15px;
    margin: 0 5px;
    border-radius: 3px;
    transition: background 0.3s;
  }

  .blue-nav a:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  /* --- PINK SCROLL CONTAINER --- */
  .scroll-container {
    background-color: var(--primary-pink);
    padding: 10px 5px;
    overflow-x: auto;
    display: flex;
    white-space: nowrap;
    scrollbar-width: thin;
    scrollbar-color: #ffffff var(--primary-pink);
  }

  .scroll-container a {
    background-color: #FFFFFF;
    color: var(--primary-pink);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    padding: 6px 15px;
    margin: 0 5px;
    border-radius: 4px;
    display: inline-block;
    flex-shrink: 0;
    transition: transform 0.2s ease;
  }

  .scroll-container a:hover {
    background-color: #f0f0f0;
    transform: translateY(-1px);
  }

  /* --- HEADER & CONTENT --- */
  header {
    background: #fff9db;
    padding: 25px 20px;
    text-align: center;
    font-size: 1.8rem;
    font-weight: bold;
    color: var(--primary-pink);
    border-bottom: 3px solid #FFD700;
  }

  .search-container {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 15px;
    display: flex;
    justify-content: center;
  }

  #postSearch {
    width: 100%;
    max-width: 500px;
    padding: 12px 20px;
    font-size: 16px;
    border: 2px solid var(--primary-pink);
    border-radius: 30px;
    outline: none;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }

  .container {
    max-width: 800px;
    margin: auto;
    padding: 15px;
    flex: 1;
  }

  .post-card {
    background: var(--light-yellow);
    padding: 22px;
    margin-bottom: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    border-left: 6px solid var(--primary-pink);
    transition: transform 0.2s;
  }

  .post-card h2 {
    margin: 0 0 10px;
    color: var(--primary-blue);
    font-size: 1.4rem;
  }

  .post-meta-desc {
    color: #444;
    font-size: 15px;
    margin: 10px 0;
    line-height: 1.6;
  }

  /* --- PAGINATION & FOOTER --- */
  .pg-btn {
    min-width: 40px;
    height: 40px;
    border: 2px solid var(--primary-pink);
    border-radius: 50%;
    background: #fff9db;
    color: var(--primary-pink);
    font-weight: bold;
    cursor: pointer;
    margin: 0 4px;
  }

  .pg-btn.active {
    background: var(--primary-pink);
    color: #FFD700;
  }

  footer {
    background: var(--primary-blue);
    color: white;
    text-align: center;
    padding: 30px 20px;
    margin-top: 40px;
  }

  .footer-links {
    margin-bottom: 15px;
  }

  .footer-links a {
    color: #ccc;
    text-decoration: none;
    margin: 0 10px;
    font-size: 14px;
  }

  .footer-links a:hover { color: #fff; }
</style>
</head>

<body>

<nav class="blue-nav">
  <a href="https://csrgnk.github.io/Omnnbc/about-us">About Us</a>
  <a href="https://csrgnk.github.io/Omnnbc/contact-us">Contact Us</a>
  <a href="https://csrgnk.github.io/Omnnbc/dmca">DMCA</a>
  <a href="https://csrgnk.github.io/Omnnbc/privacy-policy">Privacy Policy</a>
</nav>

<div class="scroll-container">
  <a href="https://csrgnk.github.io/Omnnbc/">Home</a>
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
  <a href="https://csrgnk.github.io/manache-shlok/hindi/">Manache Shlok Hindi</a>
</div>

<header>Namo Narayanaya Bhakthi Channel</header>

<div class="search-container">
  <input type="text" id="postSearch" placeholder="Search stotrams or posts...">
</div>

<div class="container" id="postsContainer">Loading...</div>
<div class="pagination-wrapper" style="display:flex; justify-content:center; margin:30px 0;" id="paginationWrapper"></div>

<footer>
  <div class="footer-links">
    <a href="https://csrgnk.github.io/Omnnbc/about-us">About</a>
    <a href="https://csrgnk.github.io/Omnnbc/contact-us">Contact</a>
    <a href="https://csrgnk.github.io/Omnnbc/dmca">DMCA</a>
    <a href="https://csrgnk.github.io/Omnnbc/privacy-policy">Privacy Policy</a>
  </div>
  <p>© 2026 Namo Narayanaya Bhakthi Channel</p>
</footer>

<script>
let allPosts=[];
let filteredPosts=[];
let currentPage=1;
const postsPerPage=25;

fetch("./data/posts.json?v="+Date.now())
.then(r=>r.json())
.then(data=>{
    allPosts=data.sort((a,b)=>new Date(b.publish_date)-new Date(a.publish_date));
    filteredPosts=[...allPosts];
    renderPage();
});

function renderPage(){
    const container=document.getElementById("postsContainer");
    container.innerHTML="";
    const start=(currentPage-1)*postsPerPage;
    const end=start+postsPerPage;
    const items=filteredPosts.slice(start,end);

    if(items.length===0){
        container.innerHTML="<p style='text-align:center;'>No posts found</p>";
        return;
    }

    items.forEach(post=>{
        const slug=post.url;
        
        // LOGIC: Take 200 chars, then remove the last 20 to show ~180
        let fullDesc = post.description || "";
        let trimmedDesc = fullDesc.substring(0, 180); // Adjusted to 180 directly for cleaner professional look

        const card=document.createElement("div");
        card.className="post-card";
        card.innerHTML=`
            <h2><a href="/${slug}/" style="text-decoration:none;color:inherit;">${post.title}</a></h2>
            <div class="post-meta-desc">${trimmedDesc}...</div>
            <a href="/${slug}/" style="color:var(--accent-orange);font-weight:bold;text-decoration:none;font-size:14px;">READ MORE →</a>
        `;
        container.appendChild(card);
    });

    setupPagination();
    window.scrollTo(0,0);
}

// ... (Existing setupPagination and Search Logic remains the same) ...
function setupPagination(){
    const totalPages=Math.ceil(filteredPosts.length/postsPerPage);
    const wrapper=document.getElementById("paginationWrapper");
    wrapper.innerHTML="";
    if(totalPages<=1)return;
    const numbersDiv=document.createElement("div");
    numbersDiv.style.display="flex";
    for(let i=1;i<=totalPages;i++){
        const btn=document.createElement("button");
        btn.className="pg-btn"+(i===currentPage?" active":"");
        btn.innerText=i;
        btn.onclick=()=>{currentPage=i; renderPage();};
        numbersDiv.appendChild(btn);
    }
    wrapper.appendChild(numbersDiv);
}

document.getElementById("postSearch").addEventListener("input",(e)=>{
    const term=e.target.value.toLowerCase();
    filteredPosts=allPosts.filter(p=>p.title.toLowerCase().includes(term));
    currentPage=1;
    renderPage();
});
</script>

</body>
</html>
