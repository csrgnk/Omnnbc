<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<style>
:root {
  --primary-pink:#C71585;
  --dark-blue:#001a4d;
  --accent-orange:#EF6C00;
}
body{
  margin:0;
  font-family:'Segoe UI',Arial;
  background:#f1f3f5;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
.blue-nav{
  background:var(--dark-blue);
  padding:6px 0;
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
  scrollbar-width:none;
}
.blue-nav::-webkit-scrollbar{display:none;}
.blue-nav a{
  color:#fff;
  text-decoration:none;
  font-size:13px;
  padding:4px 15px;
  flex-shrink:0;
}
.scroll-container{
  background:var(--primary-pink);
  padding:6px 0;
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
}
.scroll-container::-webkit-scrollbar{display:none;}
.scroll-container a{
  background:#fff;
  color:var(--primary-pink);
  text-decoration:none;
  font-weight:600;
  font-size:13px;
  padding:4px 12px;
  margin:0 5px;
  border-radius:4px;
}
header{
  background:#fff9db;
  padding:12px;
  text-align:center;
  color:var(--primary-pink);
  border-bottom:2px solid #FFD700;
}
header span{
  display:block;
  font-weight:bold;
}
.container{
  max-width:700px;
  margin:auto;
  padding:10px;
  flex:1;
}
.post-card{
  background:#FFFDE7;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border-left:5px solid var(--primary-pink);
}
.post-card h2{
  margin:0;
  font-size:1.05rem;
}
.post-meta-desc{
  font-size:13px;
  margin:5px 0;
}
.pagination-wrapper{
  display:flex;
  justify-content:center;
  padding:15px;
}
.page-numbers-container{
  display:flex;
  overflow-x:auto;
  gap:8px;
}
.pg-btn{
  min-width:34px;
  height:34px;
  border:1px solid var(--primary-pink);
  background:#fff;
  color:var(--primary-pink);
}
.pg-btn.active{
  background:var(--primary-pink);
  color:#fff;
}
footer{
  background:var(--dark-blue);
  color:#fff;
  text-align:center;
  padding:12px;
}
</style>
</head>

<body>

<!-- ✅ NAV (CLEAN URL) -->
<nav class="blue-nav">
  <a href="/about-us">About Us</a>
  <a href="/contact-us">Contact Us</a>
  <a href="/dmca">DMCA</a>
  <a href="/privacy-policy">Privacy Policy</a>
</nav>

<div class="scroll-container">
  <a href="/">Home</a>
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
  <a href="https://csrgnk.github.io/manache-shlok/hindi/">Manache Shlok Hindi</a>
</div>

<header>
  <span class="line1">Namo Narayanaya</span>
  <span class="line2">Bhakthi Channel</span>
</header>

<div class="container" id="postsContainer">Loading...</div>
<div class="pagination-wrapper" id="paginationWrapper"></div>

<footer>
© 2026 Namo Narayanaya Bhakthi Channel
</footer>

<script>
// ✅ BASE URL FIX
const repoName="Omnnbc";
const isGitHub=location.hostname.includes("github.io");
const baseUrl=isGitHub?"/"+repoName:"";

let allPosts=[];
let filteredPosts=[];
let currentPage=1;
const postsPerPage=25;

// ✅ LOAD POSTS
fetch(baseUrl+"/data/posts.json?v="+Date.now())
.then(r=>r.json())
.then(data=>{
  allPosts=data.sort((a,b)=>new Date(b.publish_date)-new Date(a.publish_date));
  filteredPosts=[...allPosts];
  renderPage();
});

// ✅ RENDER
function renderPage(){
  const container=document.getElementById("postsContainer");
  container.innerHTML="";

  const start=(currentPage-1)*postsPerPage;
  const items=filteredPosts.slice(start,start+postsPerPage);

  items.forEach(post=>{
    const slug=post.url;
    const desc=(post.description||"").substring(0,180);

    const card=document.createElement("div");
    card.className="post-card";

    card.innerHTML=`
      <h2>
        <a href="${baseUrl}/${slug}" style="text-decoration:none;color:inherit;">
          ${post.title}
        </a>
      </h2>
      <div class="post-meta-desc">${desc}...</div>
      <a href="${baseUrl}/${slug}" style="color:var(--accent-orange);font-weight:bold;text-decoration:none;font-size:12px;">
        READ MORE →
      </a>
    `;

    container.appendChild(card);
  });

  setupPagination();
  window.scrollTo(0,0);
}

// ✅ PAGINATION
function setupPagination(){
  const totalPages=Math.ceil(filteredPosts.length/postsPerPage);
  const wrapper=document.getElementById("paginationWrapper");
  wrapper.innerHTML="";

  if(totalPages<=1) return;

  const div=document.createElement("div");
  div.className="page-numbers-container";

  for(let i=1;i<=totalPages;i++){
    const btn=document.createElement("button");
    btn.className="pg-btn"+(i===currentPage?" active":"");
    btn.innerText=i;
    btn.onclick=()=>{currentPage=i;renderPage();};
    div.appendChild(btn);
  }

  wrapper.appendChild(div);
}
</script>

</body>
</html>
