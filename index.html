<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namo Narayanaya Bhakthi Channel</title>

<style>
  :root {
    --primary-pink: #C71585;
    --dark-blue: #001a4d; /* Dark Blue */
    --accent-orange: #EF6C00;
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f1f3f5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* --- DARK BLUE TOP MENU (Centered) --- */
  .blue-nav {
    background-color: var(--dark-blue);
    padding: 10px 0;
    display: flex;
    justify-content: center; /* Centers the links */
    flex-wrap: wrap;         /* Allows wrapping on mobile */
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .blue-nav a {
    color: #ffffff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 5px 12px;
    margin: 2px 5px;
    text-align: center;
  }

  /* --- PINK SCROLL MENU --- */
  .scroll-container {
    background-color: var(--primary-pink);
    padding: 8px 5px;
    overflow-x: auto;
    display: flex;
    white-space: nowrap;
    scrollbar-width: none;
  }
  .scroll-container::-webkit-scrollbar { display: none; }

  .scroll-container a {
    background-color: #FFFFFF;
    color: var(--primary-pink);
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    padding: 5px 12px;
    margin: 0 4px;
    border-radius: 4px;
  }

  /* --- HEADER (Two Lines, Centered) --- */
  header {
    background: #fff9db;
    padding: 20px 10px;
    text-align: center;
    color: var(--primary-pink);
    border-bottom: 2px solid #FFD700;
    line-height: 1.2; /* Keeps lines close together */
  }

  header .line1, header .line2 {
    display: block;
    font-size: 1.5rem; /* Same size for both lines */
    font-weight: bold;
  }

  /* --- SEARCH --- */
  .search-container {
    max-width: 800px;
    margin: 15px auto;
    padding: 0 15px;
    text-align: center;
  }
  #postSearch {
    width: 100%;
    max-width: 400px;
    padding: 10px;
    font-size: 14px;
    border: 1.5px solid var(--primary-pink);
    border-radius: 20px;
    outline: none;
    text-align: center;
  }

  /* --- COMPACT POST CARDS --- */
  .container {
    max-width: 700px;
    margin: auto;
    padding: 10px;
    flex: 1;
  }

  .post-card {
    background: #FFFDE7;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    border-left: 5px solid var(--primary-pink);
  }

  .post-card h2 {
    margin: 0 0 5px;
    color: var(--dark-blue);
    font-size: 1.1rem; /* Decreased title size */
    line-height: 1.3;
  }

  .post-meta-desc {
    color: #444;
    font-size: 13px;
    margin: 5px 0;
    line-height: 1.4;
  }

  /* --- HORIZONTAL SCROLLABLE PAGINATION --- */
  .pagination-wrapper {
    display: flex;
    justify-content: center;
    padding: 20px 10px;
    background: #fff;
    border-top: 1px solid #ddd;
  }

  .page-numbers-container {
    display: flex;
    overflow-x: auto;
    max-width: 80%; /* Takes up most of the width but scrolls if needed */
    padding: 5px;
    gap: 8px;
    scrollbar-width: thin;
  }

  .pg-btn {
    min-width: 36px;
    height: 36px;
    border: 1.5px solid var(--primary-pink);
    border-radius: 4px;
    background: #fff;
    color: var(--primary-pink);
    font-weight: bold;
    cursor: pointer;
    flex-shrink: 0;
  }

  .pg-btn.active {
    background: var(--primary-pink);
    color: #fff;
  }

  footer {
    background: var(--dark-blue);
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 13px;
  }
</style>
</head>

<body>

<nav class="blue-nav">
  <a href="https://csrgnk.github.io/Omnnbc/about-us">About Us</a>
  <a href="https://csrgnk.github.io/Omnnbc/contact-us">Contact Us</a>
  <a href="https://csrgnk.github.io/Omnnbc/dmca">DMCA</a>
  <a href="https://csrgnk.github.io/Omnnbc/privacy-policy">Privacy Policy</a>
</nav>

<div class="scroll-container">
  <a href="https://csrgnk.github.io/Omnnbc/">Home</a>
  <a href="https://csrgnk.github.io/Dasabodha/">Dasabodha</a>
  <a href="https://csrgnk.github.io/Upasana-Chandrika/">Upasana Chandrika</a>
  <a href="https://csrgnk.github.io/manache-shlok/">Manache Shlok Telugu</a>
  <a href="https://csrgnk.github.io/manache-shlok/hindi/">Manache Shlok Hindi</a>
</div>

<header>
  <span class="line1">Namo Narayanaya</span>
  <span class="line2">Bhakthi Channel</span>
</header>

<div class="search-container">
  <input type="text" id="postSearch" placeholder="Search stotrams...">
</div>

<div class="container" id="postsContainer">Loading...</div>

<div class="pagination-wrapper" id="paginationWrapper"></div>

<footer>
  <p>© 2026 Namo Narayanaya Bhakthi Channel</p>
</footer>

<script>
let allPosts=[];
let filteredPosts=[];
let currentPage=1;
const postsPerPage=25;

fetch("./data/posts.json?v="+Date.now())
.then(r=>r.json())
.then(data=>{
    allPosts=data.sort((a,b)=>new Date(b.publish_date)-new Date(a.publish_date));
    filteredPosts=[...allPosts];
    renderPage();
});

function renderPage(){
    const container=document.getElementById("postsContainer");
    container.innerHTML="";
    const start=(currentPage-1)*postsPerPage;
    const end=start+postsPerPage;
    const items=filteredPosts.slice(start,end);

    items.forEach(post=>{
        const slug=post.url;
        // Logic: 180 characters (removed 20 from 200)
        const desc=(post.description||"").substring(0,180);

        const card=document.createElement("div");
        card.className="post-card";
        card.innerHTML=`
            <h2><a href="/${slug}/" style="text-decoration:none;color:inherit;">${post.title}</a></h2>
            <div class="post-meta-desc">${desc}...</div>
            <a href="/${slug}/" style="color:var(--accent-orange);font-weight:bold;text-decoration:none;font-size:12px;">READ MORE →</a>
        `;
        container.appendChild(card);
    });

    setupPagination();
    window.scrollTo(0,0);
}

function setupPagination(){
    const totalPages=Math.ceil(filteredPosts.length/postsPerPage);
    const wrapper=document.getElementById("paginationWrapper");
    wrapper.innerHTML="";
    if(totalPages<=1) return;

    const numbersDiv=document.createElement("div");
    numbersDiv.className="page-numbers-container";

    for(let i=1; i<=totalPages; i++){
        const btn=document.createElement("button");
        btn.className="pg-btn"+(i===currentPage?" active":"");
        btn.innerText=i;
        btn.onclick=()=>{currentPage=i; renderPage();};
        numbersDiv.appendChild(btn);
    }
    wrapper.appendChild(numbersDiv);
}

document.getElementById("postSearch").addEventListener("input",(e)=>{
    const term=e.target.value.toLowerCase();
    filteredPosts=allPosts.filter(p=>p.title.toLowerCase().includes(term));
    currentPage=1;
    renderPage();
});
</script>

</body>
</html>
