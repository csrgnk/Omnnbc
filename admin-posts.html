<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Posts</title>
    <script>
        if(sessionStorage.getItem("auth_status") !== "verified") { window.location.href = "./admin.html"; }
    </script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; margin: 0; padding-bottom: 80px; }
        .header { background: #C71585; color: white; padding: 20px; text-align: center; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .post-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .edit-btn { background: #007bff; color: white; text-decoration: none; padding: 10px 15px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .fab { position: fixed; bottom: 20px; right: 20px; background: #C71585; color: white; width: 60px; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 30px; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="header">OMNNBC Dashboard</div>
    <div class="container" id="list">Loading Posts...</div>
    <a href="./admin-add-post.html" class="fab">+</a>

    <script>
        fetch('./data/posts.json').then(res => res.json()).then(data => {
            const list = document.getElementById('list');
            list.innerHTML = "";
            data.forEach(post => {
                list.innerHTML += `
                    <div class="post-card">
                        <div><strong>${post.title}</strong><br><small>${post.publish_date}</small></div>
                        <a href="./admin-add-post.html?edit=${post.url}" class="edit-btn">Edit</a>
                    </div>`;
            });
        }).catch(() => { document.getElementById('list').innerText = "No posts found."; });
    </script>
</body>
</html>
