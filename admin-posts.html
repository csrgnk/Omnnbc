<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script>
        // Check for secret code access
        if(sessionStorage.getItem("admin_key") !== "active") { window.location.href = "./admin.html"; }
    </script>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; }
        .header { background: #C71585; color: white; padding: 20px; text-align: center; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .post-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .edit-btn { background: #007bff; color: white; text-decoration: none; padding: 8px 15px; border-radius: 6px; font-size: 13px; }
        .fab { position: fixed; bottom: 20px; right: 20px; background: #C71585; color: white; width: 60px; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 30px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">Posts Dashboard</div>
    <div class="container" id="list">Loading...</div>
    <a href="./admin-add-post.html" class="fab">+</a>

    <script>
        fetch('./data/posts.json').then(res => res.json()).then(data => {
            const container = document.getElementById('list');
            container.innerHTML = "";
            data.forEach(post => {
                container.innerHTML += `
                    <div class="post-card">
                        <div><strong>${post.title}</strong><br><small>${post.publish_date}</small></div>
                        <a href="./admin-add-post.html?edit=${post.url}" class="edit-btn">Edit</a>
                    </div>`;
            });
        });
    </script>
</body>
</html>
