<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap Generator - Omnnbc</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; color: #2c3e50; line-height: 1.6; padding: 40px; text-align: center; }
        .container { max-width: 850px; margin: auto; background: #ffffff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #e67e22; margin-bottom: 15px; font-size: 28px; }
        p { color: #7f8c8d; margin-bottom: 30px; font-size: 16px; }
        .btn { background-color: #e67e22; color: white; border: none; padding: 16px 40px; font-size: 18px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #d35400; box-shadow: 0 5px 15px rgba(211, 84, 0, 0.3); }
        #output-section { margin-top: 35px; display: none; text-align: left; }
        #status-msg { font-weight: bold; margin-bottom: 10px; color: #2980b9; }
        #sitemap-output { width: 100%; height: 400px; padding: 15px; border: 1px solid #dcdde1; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 13px; background-color: #2f3640; color: #f5f6fa; overflow: auto; resize: none; }
        .copy-btn { background-color: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        #success-toast { display: none; color: #27ae60; font-weight: bold; margin-left: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Omnnbc Sitemap Tool</h1>
    <p>Generating sitemap from <b>data/pages.json</b> and <b>data/posts.json</b>.</p>

    <button class="btn" onclick="generateSitemap()">Generate Sitemap</button>

    <div id="output-section">
        <div id="status-msg"></div>
        <textarea id="sitemap-output" readonly></textarea>
        <div>
            <button class="copy-btn" onclick="copyXml()">Copy XML Script</button>
            <span id="success-toast">Copied to clipboard!</span>
        </div>
    </div>
</div>

<script>
    async function generateSitemap() {
        const outputSection = document.getElementById('output-section');
        const outputArea = document.getElementById('sitemap-output');
        const status = document.getElementById('status-msg');
        const domain = "https://omnnbc.com";
        
        outputSection.style.display = 'block';
        status.innerText = "Processing JSON files...";

        try {
            let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

            // 1. Home Page
            xml += `  <url>\n    <loc>${domain}/</loc>\n    <lastmod>${new Date().toISOString()}</lastmod>\n    <priority>1.0</priority>\n  </url>\n`;

            // 2. Fetch Pages (Reading from "file" key as per your JSON)
            let pageCount = 0;
            try {
                const pRes = await fetch('data/pages.json');
                const pData = await pRes.json();
                pData.forEach(p => {
                    // It now specifically looks for the "file" key you provided
                    let slug = p.file || p.url || p.id;
                    if (slug) {
                        slug = slug.replace('.html', '');
                        xml += `  <url>\n    <loc>${domain}/${slug}</loc>\n    <lastmod>${new Date().toISOString().split('T')[0]}</lastmod>\n    <priority>0.8</priority>\n  </url>\n`;
                        pageCount++;
                    }
                });
            } catch (e) { console.warn("Pages JSON error:", e); }

            // 3. Fetch Posts
            let postCount = 0;
            try {
                const poRes = await fetch('data/posts.json');
                const poData = await poRes.json();
                poData.forEach(post => {
                    let slug = post.file || post.url || post.slug;
                    if (slug) {
                        // Cleans folder names and extensions
                        slug = slug.split('/').pop().replace('.html', '');
                        const date = post.publish_date ? post.publish_date.split('T')[0] : new Date().toISOString().split('T')[0];
                        xml += `  <url>\n    <loc>${domain}/${slug}</loc>\n    <lastmod>${date}</lastmod>\n    <priority>0.7</priority>\n  </url>\n`;
                        postCount++;
                    }
                });
            } catch (e) { console.warn("Posts JSON error:", e); }

            xml += `</urlset>`;
            outputArea.value = xml;
            status.innerText = `Success: Found ${pageCount} Pages and ${postCount} Posts.`;

        } catch (error) {
            status.style.color = "#c0392b";
            status.innerText = "Error: " + error.message;
        }
    }

    function copyXml() {
        const area = document.getElementById("sitemap-output");
        area.select();
        document.execCommand("copy");
        const toast = document.getElementById("success-toast");
        toast.style.display = "inline-block";
        setTimeout(() => { toast.style.display = "none"; }, 3000);
    }
</script>

</body>
</html>
