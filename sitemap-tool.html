<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap Generator Tool - Omnnbc</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; line-height: 1.6; padding: 40px; text-align: center; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #ff9800; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .btn { background-color: #ff9800; color: white; border: none; padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3); }
        .btn:hover { background-color: #fb8c00; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4); }
        .btn:active { transform: translateY(0); }
        #output-container { margin-top: 30px; display: none; text-align: left; }
        #sitemap-output { width: 100%; height: 400px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Courier New', Courier, monospace; font-size: 14px; background-color: #272822; color: #f8f8f2; overflow: auto; margin-bottom: 15px; }
        .copy-btn { background-color: #4caf50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .copy-btn:hover { background-color: #43a047; }
    </style>
</head>
<body>

<div class="container">
    <h1>Omnnbc Sitemap Tool</h1>
    <p>Click the button below to generate the XML script for your 360+ posts. You can then copy and paste it into your sitemap.xml file.</p>

    <button class="btn" onclick="fetchDataAndGenerate()">Generate Sitemap Script</button>

    <div id="output-container">
        <h3>Generated XML Script:</h3>
        <textarea id="sitemap-output" readonly></textarea>
        <button class="copy-btn" onclick="copyToClipboard()">Copy XML Script</button>
        <p id="copy-msg" style="color: green; display: none; margin-top: 10px;">Copied to clipboard!</p>
    </div>
</div>

<script>
    async function fetchDataAndGenerate() {
        const outputContainer = document.getElementById('output-container');
        const outputArea = document.getElementById('sitemap-output');
        const domain = "https://omnnbc.com";
        
        outputContainer.style.display = 'block';
        outputArea.value = "Fetching data from posts.json... Please wait.";

        try {
            // Fetch your posts.json from your GitHub repo
            const response = await fetch('data/posts.json');
            if (!response.ok) throw new Error('Could not load posts.json');
            const posts = await response.json();

            let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

            // 1. Home Page
            xml += `  <url>\n    <loc>${domain}/</loc>\n    <lastmod>${new Date().toISOString()}</lastmod>\n    <changefreq>daily</changefreq>\n    <priority>1.0</priority>\n  </url>\n`;

            // 2. Loop through posts
            posts.forEach(post => {
                if (post.url) {
                    let cleanPath = post.url.replace(/^posts\//, '').replace(/^pages\//, '').replace('.html', '');
                    if (cleanPath.includes('/')) { cleanPath = cleanPath.split('/').pop(); }

                    const fullUrl = `${domain}/${cleanPath}`;
                    const date = post.publish_date ? post.publish_date.split('T')[0] : new Date().toISOString().split('T')[0];

                    xml += `  <url>\n    <loc>${fullUrl}</loc>\n    <lastmod>${date}</lastmod>\n    <changefreq>daily</changefreq>\n    <priority>0.8</priority>\n  </url>\n`;
                }
            });

            xml += `</urlset>`;
            outputArea.value = xml;

        } catch (error) {
            outputArea.value = "Error: " + error.message + "\nMake sure data/posts.json exists in your repository.";
        }
    }

    function copyToClipboard() {
        const copyText = document.getElementById("sitemap-output");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        document.execCommand("copy");
        
        const msg = document.getElementById("copy-msg");
        msg.style.display = "block";
        setTimeout(() => { msg.style.display = "none"; }, 3000);
    }
</script>

</body>
  </html>
