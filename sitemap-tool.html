<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap Generator - Omnnbc</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; color: #2c3e50; line-height: 1.6; padding: 40px; text-align: center; }
        .container { max-width: 850px; margin: auto; background: #ffffff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #e67e22; margin-bottom: 15px; font-size: 28px; }
        p { color: #7f8c8d; margin-bottom: 30px; font-size: 16px; }
        .btn { background-color: #e67e22; color: white; border: none; padding: 16px 40px; font-size: 18px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #d35400; box-shadow: 0 5px 15px rgba(211, 84, 0, 0.3); }
        #output-section { margin-top: 35px; display: none; text-align: left; }
        #status-msg { font-weight: bold; margin-bottom: 10px; color: #2980b9; }
        #sitemap-output { width: 100%; height: 400px; padding: 15px; border: 1px solid #dcdde1; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 14px; background-color: #2f3640; color: #f5f6fa; overflow: auto; resize: none; }
        .copy-btn { background-color: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        #success-toast { display: none; color: #27ae60; font-weight: bold; margin-left: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Omnnbc Sitemap Tool</h1>
    <p>Generating sitemap automatically from <b>data/pages.json</b> and <b>data/posts.json</b>.</p>

    <button class="btn" onclick="generateSitemap()">Generate Sitemap from JSON</button>

    <div id="output-section">
        <div id="status-msg"></div>
        <textarea id="sitemap-output" readonly></textarea>
        <div>
            <button class="copy-btn" onclick="copyXml()">Copy XML Script</button>
            <span id="success-toast">Copied to clipboard!</span>
        </div>
    </div>
</div>

<script>
    async function generateSitemap() {
        const outputSection = document.getElementById('output-section');
        const outputArea = document.getElementById('sitemap-output');
        const status = document.getElementById('status-msg');
        const domain = "https://omnnbc.com";
        
        outputSection.style.display = 'block';
        status.innerText = "Fetching JSON data...";

        try {
            let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

            // 1. Always add Home Page
            xml += `  <url>\n    <loc>${domain}/</loc>\n    <lastmod>${new Date().toISOString()}</lastmod>\n    <priority>1.0</priority>\n  </url>\n`;

            // 2. Fetch and Process Pages (about-us, contact-us, dmca, etc.)
            const pagesRes = await fetch('data/pages.json');
            const pages = await pagesRes.json();
            pages.forEach(p => {
                if (p.url) {
                    let path = p.url.replace('.html', '').split('/').pop();
                    xml += `  <url>\n    <loc>${domain}/${path}</loc>\n    <lastmod>${new Date().toISOString().split('T')[0]}</lastmod>\n    <priority>0.8</priority>\n  </url>\n`;
                }
            });

            // 3. Fetch and Process Posts (The 360+ devotional posts)
            const postsRes = await fetch('data/posts.json');
            const posts = await postsRes.json();
            posts.forEach(post => {
                if (post.url) {
                    let path = post.url.replace('.html', '').split('/').pop();
                    xml += `  <url>\n    <loc>${domain}/${path}</loc>\n    <lastmod>${post.publish_date ? post.publish_date.split('T')[0] : new Date().toISOString().split('T')[0]}</lastmod>\n    <priority>0.7</priority>\n  </url>\n`;
                }
            });

            xml += `</urlset>`;
            outputArea.value = xml;
            status.innerText = "Found " + pages.length + " pages and " + posts.length + " posts. Generation successful!";

        } catch (error) {
            status.style.color = "#c0392b";
            status.innerText = "Error loading JSON: " + error.message;
        }
    }

    function copyXml() {
        const area = document.getElementById("sitemap-output");
        area.select();
        document.execCommand("copy");
        const toast = document.getElementById("success-toast");
        toast.style.display = "inline-block";
        setTimeout(() => { toast.style.display = "none"; }, 3000);
    }
</script>

</body>
</html>
