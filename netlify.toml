[build]
  command = "node generate-sitemap.js"
  publish = "."

[[redirects]]
  from = "/posts/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/pages/*"
  to = "/:splat"
  status = 301
  force = true

# This is the MAGIC line that fixes 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
