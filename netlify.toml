[build]
  command = "node generate-sitemap.js"
  publish = "."

# Ensure all files are served as HTML
[[headers]]
  for = "/*"
  [headers.values]
    Content-Type = "text/html"

# Redirects for Posts - Mapping to internal folders
[[redirects]]
  from = "/posts/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/pages/*"
  to = "/:splat"
  status = 301
  force = true

# This handles the Clean URLs properly without showing Raw Text
[[redirects]]
  from = "/:slug"
  to = "/posts/:slug.html"
  status = 200

[[redirects]]
  from = "/:slug"
  to = "/pages/:slug.html"
  status = 200
