<script>
function submit() {
    const title = document.getElementById('p-title').value.trim();
    const desc = document.getElementById('p-desc').value.trim() || "No description";

    let content = "";

    // 1. Check if HTML Raw editor is active and has content
    const raw = document.getElementById('html-raw');
    if (raw && document.getElementById('html-raw').style.display === "block") {
        content = raw.value;
    } 
    // 2. Otherwise, get content from Quill
    else if (typeof quill !== "undefined" && quill.root) {
        content = quill.root.innerHTML;
    }

    // Validation: Check if both are empty
    if (!title || !content || content === "<p><br></p>") {
        alert("Title and Content are required!");
        return;
    }

    // ✅ IMPORTANT: DO NOT remove HTML tags. 
    // We send Description on Line 1 and HTML Content from Line 2.
    const body = desc + "\n" + content;

    const url = "https://github.com/csrgnk/csrgnk.github.io/issues/new" +
        "?title=" + encodeURIComponent("POST: " + title) +
        "&body=" + encodeURIComponent(body);

    window.open(url, "_blank");
}
</script>
