<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editor | OMNNBC</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; }
        nav { background: #C71585; padding: 15px; color: white; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; }
        .container { padding: 30px; max-width: 800px; margin: auto; background: white; margin-top: 20px; border-radius: 10px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        #editor { height: 300px; }
        .publish-btn { background: #C71585; color: white; border: none; padding: 15px; width: 100%; margin-top: 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="admin-posts.html">← Back to Posts</a>
    </nav>
    <div class="container">
        <h2 id="page-title">Create New Post</h2>
        <input type="text" id="post-title" placeholder="Post Title">
        <div id="editor"></div>
        <button class="publish-btn" onclick="submitToGitHub()">Update/Publish via GitHub</button>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        if(sessionStorage.getItem("admin_auth") !== "true") window.location.href="admin.html";
        var quill = new Quill('#editor', { theme: 'snow' });

        // Check if editing
        const params = new URLSearchParams(window.location.search);
        if(params.has('slug')) {
            document.getElementById('page-title').innerText = "Edit Post";
            document.getElementById('post-title').value = decodeURIComponent(params.get('title'));
            
            // Fetch old content
            fetch(`posts/${params.get('slug')}.html`)
                .then(res => res.text())
                .then(html => { quill.root.innerHTML = html; });
        }

        function submitToGitHub() {
            const title = document.getElementById('post-title').value;
            const content = quill.root.innerHTML;
            const repo = "csrgnk/csrgnk.github.io";
            
            // Redirect to GitHub Issue
            const githubUrl = `https://github.com/${repo}/issues/new?title=POST: ${encodeURIComponent(title)}&body=${encodeURIComponent(content)}`;
            window.open(githubUrl, '_blank');
        }
    </script>
</body>
</html>
