<script>
function submit() {
    const titleEl = document.getElementById('p-title');
    const descEl = document.getElementById('p-desc');
    const rawEditor = document.getElementById('html-raw');

    const title = titleEl.value.trim();
    const desc = descEl.value.trim() || "No description";

    let content = "";

    // ✅ Reliable editor detection (FIXED)
    const isRawVisible = rawEditor && window.getComputedStyle(rawEditor).display !== "none";

    if (isRawVisible) {
        content = rawEditor.value.trim();
    } else if (typeof quill !== "undefined" && quill.root) {
        content = quill.root.innerHTML.trim();
    }

    // ✅ Strong empty check (FIXED)
    let plainText = content;
    if (typeof quill !== "undefined") {
        plainText = quill.getText().trim();
    } else {
        plainText = content.replace(/<[^>]*>/g, '').trim();
    }

    if (!title || !plainText) {
        alert("Title and Content required!");
        return;
    }

    // ✅ Prevent GitHub URL limit issue (IMPORTANT)
    if (content.length > 4000) {
        alert("Content too long! Please shorten your post.");
        return;
    }

    // ✅ CLEAN HTML (prevents blank issue)
    content = content
        .replace(/\n/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    // ✅ FINAL BODY FORMAT (VERY IMPORTANT)
    const body = desc + "\n\n---\n\n" + content;

    console.log("FINAL BODY:", body); // debug

    // ✅ ENCODE SAFELY
    const url = "https://github.com/csrgnk/csrgnk.github.io/issues/new"
        + "?title=" + encodeURIComponent("POST: " + title)
        + "&body=" + encodeURIComponent(body);

    // ✅ OPEN (FIXED)
    window.open(url, "_blank");
}
</script>
