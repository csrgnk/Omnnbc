<script>
function submit() {
    const title = document.getElementById('p-title').value.trim();
    const desc = document.getElementById('p-desc').value.trim() || "No description";

    // Get content from active editor
    let content = "";
    const rawEditor = document.getElementById('html-raw');

    if (rawEditor.style.display === "block") {
        content = rawEditor.value.trim();
    } else {
        content = quill.root.innerHTML.trim();
    }

    // ✅ Better empty check (works for Quill)
    const isEmpty = (!content || content === "<p><br></p>" || quill.getText().trim().length === 0);

    if (!title || isEmpty) {
        alert("Title and Content required!");
        return;
    }

    // ✅ Prevent GitHub URL truncation issue
    if (content.length > 6000) {
        alert("Content too long! Please shorten your post.");
        return;
    }

    // ✅ Better formatting (prevents description-only issue)
    const body = `${desc}

---

${content}`;

    // ✅ Encode safely
    const githubUrl = `https://github.com/csrgnk/csrgnk.github.io/issues/new?title=${encodeURIComponent("POST: " + title)}&body=${encodeURIComponent(body)}`;

    // ✅ FIXED (_blank bug)
    window.open(githubUrl, '_blank');
}
</script>
