<script>
function submit() {
    const title = document.getElementById('p-title').value.trim();
    const desc = document.getElementById('p-desc').value.trim() || "No description";

    let content = "";

    // ✅ ALWAYS try Quill first
    if (typeof quill !== "undefined" && quill.root) {
        content = quill.root.innerHTML;
    }

    // ✅ fallback to raw editor if empty
    if (!content || content === "<p><br></p>") {
        const raw = document.getElementById('html-raw');
        if (raw) content = raw.value;
    }

    // ❗ FINAL SAFETY: convert HTML → plain text (prevents blank issue)
    const safeContent = content
        .replace(/<[^>]*>/g, '')   // remove HTML
        .replace(/\s+/g, ' ')
        .trim();

    if (!title || !safeContent) {
        alert("Title and Content required!");
        return;
    }

    // ✅ keep body simple (GitHub-safe)
    const body = desc + "\n\n---\n\n" + safeContent;

    console.log("BODY:", body); // debug

    const url =
        "https://github.com/csrgnk/csrgnk.github.io/issues/new" +
        "?title=" + encodeURIComponent("POST: " + title) +
        "&body=" + encodeURIComponent(body);

    window.open(url, "_blank");
}
</script>
