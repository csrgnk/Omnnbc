<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generate Sitemap</title>
</head>
<body>

<button onclick="generateXML()">Download Sitemap</button>

<script>
async function generateXML() {

  const domain = "https://omnnbc.com";

  const response = await fetch("https://raw.githubusercontent.com/USERNAME/REPO/main/posts.json");
  const posts = await response.json();

  let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
  xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

  posts.forEach(post => {
    const url = domain + "/" + post.url;
    const date = post.publish_date.split("T")[0];

    xml += `
  <url>
    <loc>${url}</loc>
    <lastmod>${date}</lastmod>
    <changefreq>daily</changefreq>
    <priority>0.9</priority>
  </url>`;
  });

  xml += `\n</urlset>`;

  const blob = new Blob([xml], { type: "application/xml" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "sitemap-posts.xml";
  link.click();
}
</script>

</body>
</html>
