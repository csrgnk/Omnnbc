<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sitemap Generator</title>

<style>
body {
  font-family: Arial;
  padding: 15px;
}
button {
  padding: 10px 15px;
  font-size: 16px;
  margin: 5px;
  background: #ff4081;
  color: white;
  border: none;
  border-radius: 5px;
}
pre {
  margin-top: 15px;
  background: #f5f5f5;
  padding: 10px;
  overflow-x: auto;
  white-space: pre-wrap;
}
#status {
  margin-top: 10px;
  color: green;
}
</style>

</head>
<body>

<h2>Sitemap Posts Generator</h2>

<button onclick="generateXML()">Generate Sitemap</button>
<button onclick="copyXML()">Copy XML</button>

<div id="status"></div>

<pre id="output">Click "Generate Sitemap"</pre>

<script>
let sitemapData = "";

async function generateXML() {

  const domain = "https://omnnbc.com";

  try {
    const response = await fetch("https://raw.githubusercontent.com/csrgnk/Omnnbc/main/data/posts.json");

    if (!response.ok) throw new Error("JSON not loading");

    const posts = await response.json();

    let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
    xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

    posts.sort((a, b) => new Date(b.publish_date) - new Date(a.publish_date));

    posts.forEach(post => {
      if (!post.url || !post.publish_date) return;

      const url = domain + "/" + post.url;
      const date = post.publish_date.split("T")[0];

      xml += `
  <url>
    <loc>${url}</loc>
    <lastmod>${date}</lastmod>
    <changefreq>daily</changefreq>
    <priority>0.9</priority>
  </url>`;
    });

    xml += `\n</urlset>`;

    sitemapData = xml;

    document.getElementById("output").textContent = xml;
    document.getElementById("status").textContent = "Sitemap Generated ✔";

  } catch (error) {
    document.getElementById("output").textContent = "ERROR: " + error.message;
  }
}

function copyXML() {
  if (!sitemapData) {
    alert("Generate sitemap first!");
    return;
  }

  navigator.clipboard.writeText(sitemapData).then(() => {
    document.getElementById("status").textContent = "Copied Successfully ✔";
  }).catch(() => {
    alert("Copy failed. Please copy manually.");
  });
}
</script>

</body>
</html>
