<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generate Sitemap</title>

<style>
body {
  font-family: Arial;
  padding: 15px;
}
button {
  padding: 10px 15px;
  font-size: 16px;
  background: #ff4081;
  color: white;
  border: none;
  border-radius: 5px;
}
pre {
  margin-top: 15px;
  background: #f5f5f5;
  padding: 10px;
  overflow-x: auto;
  white-space: pre-wrap;
}
</style>

</head>
<body>

<h2>Generate Sitemap Posts XML</h2>

<button onclick="generateXML()">Generate Sitemap</button>

<pre id="output">Click button to generate sitemap...</pre>

<script>
async function generateXML() {

  const domain = "https://omnnbc.com";

  try {

    // ✅ CORRECT JSON PATH
    const response = await fetch("https://raw.githubusercontent.com/csrgnk/Omnnbc/main/data/posts.json");

    if (!response.ok) {
      throw new Error("JSON not loading. Check path.");
    }

    const posts = await response.json();

    if (!Array.isArray(posts)) {
      throw new Error("JSON format should be array.");
    }

    let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
    xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

    // ✅ Sort latest first (optional)
    posts.sort((a, b) => new Date(b.publish_date) - new Date(a.publish_date));

    posts.forEach(post => {

      if (!post.url || !post.publish_date) return;

      const fullUrl = domain + "/" + post.url;
      const date = post.publish_date.split("T")[0];

      xml += `
  <url>
    <loc>${fullUrl}</loc>
    <lastmod>${date}</lastmod>
    <changefreq>daily</changefreq>
    <priority>0.9</priority>
  </url>`;
    });

    xml += `\n</urlset>`;

    // ✅ Show XML
    document.getElementById("output").textContent = xml;

  } catch (error) {
    document.getElementById("output").textContent = "ERROR: " + error.message;
  }
}
</script>

</body>
</html>
