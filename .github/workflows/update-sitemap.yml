name: GitHub Sitemap Auto-Update
on:
  push:
    branches: [ main ]
    paths:
      - 'posts/**'
      - 'pages/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Sitemap Generator
        run: node generate-sitemap.js
      - name: Auto-Commit Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: auto-update sitemap [skip ci]" || echo "No changes"
          git push
