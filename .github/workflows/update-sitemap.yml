name: Unified Sitemap Auto-Update
on:
  push:
    branches: [ main ]
    paths:
      - 'posts/*.html'
      - 'pages/*.html'

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Sitemap
        run: |
          DOMAIN="https://omnnbc.com"
          echo "<?xml version='1.0' encoding='UTF-8'?>" > sitemap.xml
          echo "<urlset xmlns='http://www.sitemaps.org/schemas/sitemap/0.9'>" >> sitemap.xml
          
          # 1. Add Home Page
          echo "  <url><loc>$DOMAIN/</loc><priority>1.0</priority></url>" >> sitemap.xml
          
          # 2. Add all files from PAGES folder
          if [ -d "pages" ]; then
            for file in pages/*.html; do
              filename=$(basename "$file")
              echo "  <url><loc>$DOMAIN/pages/$filename</loc><priority>0.7</priority></url>" >> sitemap.xml
            done
          fi

          # 3. Add all files from POSTS folder
          if [ -d "posts" ]; then
            for file in posts/*.html; do
              filename=$(basename "$file")
              echo "  <url><loc>$DOMAIN/posts/$filename</loc><priority>0.8</priority></url>" >> sitemap.xml
            done
          fi
          
          echo "</urlset>" >> sitemap.xml

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto-update sitemap: Posts & Pages [skip ci]" || echo "No changes"
          git push
