name: Clean URL Sitemap Auto-Update
on:
  push:
    branches: [ main ]
    paths:
      - 'posts/*.html'
      - 'pages/*.html'

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Clean Sitemap
        run: |
          DOMAIN="https://omnnbc.com"
          DATE=$(date +%Y-%m-%d)
          
          echo "<?xml version='1.0' encoding='UTF-8'?>" > sitemap.xml
          echo "<urlset xmlns='http://www.sitemaps.org/schemas/sitemap/0.9'>" >> sitemap.xml
          
          # 1. Home Page
          echo "  <url><loc>$DOMAIN/</loc><lastmod>$DATE</lastmod><priority>1.0</priority></url>" >> sitemap.xml
          
          # 2. Add PAGES as Clean URLs (removes 'pages/' and '.html')
          if [ -d "pages" ]; then
            for file in pages/*.html; do
              filename=$(basename "$file" .html)
              if [ "$filename" != "index" ] && [ "$filename" != "" ]; then
                echo "  <url><loc>$DOMAIN/$filename</loc><lastmod>$DATE</lastmod><priority>0.7</priority></url>" >> sitemap.xml
              fi
            done
          fi

          # 3. Add POSTS as Clean URLs (removes 'posts/' and '.html')
          if [ -d "posts" ]; then
            for file in posts/*.html; do
              filename=$(basename "$file" .html)
              if [ "$filename" != "index" ] && [ "$filename" != "" ]; then
                echo "  <url><loc>$DOMAIN/$filename</loc><lastmod>$DATE</lastmod><priority>0.8</priority></url>" >> sitemap.xml
              fi
            done
          fi
          
          echo "</urlset>" >> sitemap.xml

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Auto-update: 175+ Clean URLs in sitemap [skip ci]" || echo "No changes"
          git push
