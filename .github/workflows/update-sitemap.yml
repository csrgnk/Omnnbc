name: Automated Clean Sitemap Update

on:
  push:
    branches: [ main ]
    paths:
      - 'posts/**'
      - 'pages/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Clean URL Generator
        run: node generate-sitemap.js

      - name: Commit and Push Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Automated clean sitemap update" || echo "No changes"
          git push
