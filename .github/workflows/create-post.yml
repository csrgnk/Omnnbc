name: Automated Post Creator
on:
  issues:
    types: [opened]

jobs:
  create-post:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'POST:')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Process Issue Data
        shell: bash
        run: |
          # 1. Get Title and Slug
          RAW_TITLE=$(echo "${{ github.event.issue.title }}" | sed 's/POST: //')
          SLUG=$(echo "$RAW_TITLE" | sed -e 's/[^[:alnum:]]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/--/-/g' | sed 's/^-//;s/-$//')
          DATE=$(date +'%Y-%m-%d')

          # 2. Handle Body Data Safely
          # We save the issue body to a temporary file first
          cat << 'EOF' > full_body.txt
          ${{ github.event.issue.body }}
          EOF

          # 3. Extract Meta Description (Strictly the first line)
          JSON_DESC=$(head -n 1 full_body.txt)

          # 4. Extract HTML Content (Strictly from line 2 to the end)
          # We use 'tail' to skip the first line and save the rest to the posts folder
          mkdir -p omnnbc/posts
          tail -n +2 full_body.txt > "omnnbc/posts/$SLUG.html"

          # 5. Update data/posts.json
          mkdir -p omnnbc/data
          if [ ! -f omnnbc/data/posts.json ]; then echo "[]" > omnnbc/data/posts.json; fi
          
          # Use jq to update or prepend data
          jq --arg t "$RAW_TITLE" --arg u "$SLUG" --arg d "$DATE" --arg m "$JSON_DESC" \
          '. = [{"title": $t, "url": $u, "publish_date": $d, "description": $m}] + .' \
          omnnbc/data/posts.json > temp.json && mv temp.json omnnbc/data/posts.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update Post: $RAW_TITLE"
          git push

      - name: Auto-Close Issue
        run: gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
