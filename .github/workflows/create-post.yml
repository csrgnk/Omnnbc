name: Automated Post Creator
on:
  issues:
    types: [opened]

jobs:
  create-post:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'POST:')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Process Issue Data
        shell: bash
        run: |
          # 1. Get the Title from Issue Title
          RAW_TITLE=$(echo "${{ github.event.issue.title }}" | sed 's/POST: //')
          
          # 2. Create the Slug (URL)
          SLUG=$(echo "$RAW_TITLE" | sed -e 's/[^[:alnum:]]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/--/-/g' | sed 's/^-//;s/-$//')
          
          # 3. Get the Date
          DATE=$(date +'%Y-%m-%d')

          # 4. SPLIT DATA: First line is Description, the rest is HTML Content
          # We use a temporary file to handle multi-line HTML safely
          echo "${{ github.event.issue.body }}" > full_body.txt
          
          # Extract first line for JSON description
          JSON_DESC=$(head -n 1 full_body.txt)
          
          # Extract everything from line 2 onwards for the HTML file
          tail -n +2 full_body.txt > "omnnbc/posts/$SLUG.html"

          # 5. Update data/posts.json
          mkdir -p omnnbc/data
          if [ ! -f omnnbc/data/posts.json ]; then echo "[]" > omnnbc/data/posts.json; fi
          
          # Prepend new data to JSON with 'description' key
          jq --arg t "$RAW_TITLE" --arg u "$SLUG" --arg d "$DATE" --arg m "$JSON_DESC" \
          '. = [{"title": $t, "url": $u, "publish_date": $d, "description": $m}] + .' \
          omnnbc/data/posts.json > temp.json && mv temp.json omnnbc/data/posts.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update/Create Post: ${{ github.event.issue.title }}"
          git push

      - name: Close Issue
        run: gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
