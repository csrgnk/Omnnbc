name: Automated Post Creator
on:
  issues:
    types: [opened]

jobs:
  create-post:
    runs-on: ubuntu-latest
    # Only runs if the issue title starts with 'POST:'
    if: startsWith(github.event.issue.title, 'POST:')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Process Issue and Create Files
        shell: bash
        run: |
          # 1. Extract Title from Issue Title
          RAW_TITLE=$(echo "${{ github.event.issue.title }}" | sed 's/POST: //')
          
          # 2. Extract Body (Content)
          CONTENT='${{ github.event.issue.body }}'
          
          # 3. Generate URL Slug (converts title to lowercase-hyphen-format)
          # Specifically handles English and preserves Telugu script for JSON
          SLUG=$(echo "$RAW_TITLE" | sed -e 's/[^[:alnum:]]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/--/-/g' | sed 's/^-//;s/-$//')
          
          # 4. Get Current Date
          DATE=$(date +'%Y-%m-%d')

          # 5. Create the HTML Post File
          mkdir -p omnnbc/posts
          echo "$CONTENT" > "omnnbc/posts/$SLUG.html"

          # 6. Update data/posts.json
          mkdir -p omnnbc/data
          # Create empty JSON array if file doesn't exist
          if [ ! -f omnnbc/data/posts.json ]; then echo "[]" > omnnbc/data/posts.json; fi
          
          # Use jq to prepend the new post to the JSON array
          jq --arg t "$RAW_TITLE" --arg u "$SLUG" --arg d "$DATE" \
          '. = [{"title": $t, "url": $u, "publish_date": $d}] + .' \
          omnnbc/data/posts.json > temp.json && mv temp.json omnnbc/data/posts.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generated post: ${{ github.event.issue.title }}"
          git push

      - name: Auto-Close Issue
        run: gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
