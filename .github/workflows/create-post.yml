name: Automated Post Creator
on:
  issues:
    types: [opened]

jobs:
  create-post:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'POST:')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Process Issue Data
        shell: bash
        run: |
          RAW_TITLE=$(echo "${{ github.event.issue.title }}" | sed 's/POST: //')
          DATE=$(date +'%Y-%m-%d')
          # Create URL slug from title
          SLUG=$(echo "$RAW_TITLE" | sed -e 's/[^[:alnum:]]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/--/-/g' | sed 's/^-//;s/-$//')

          # Line 1 of issue body = meta_description
          META=$(echo "${{ github.event.issue.body }}" | head -n 1)
          # Remaining lines = HTML content
          CONTENT=$(echo "${{ github.event.issue.body }}" | tail -n +2)

          # Save HTML File
          mkdir -p omnnbc/posts
          echo "$CONTENT" > "omnnbc/posts/$SLUG.html"

          # Update JSON with your specific keys
          mkdir -p omnnbc/data
          if [ ! -f omnnbc/data/posts.json ]; then echo "[]" > omnnbc/data/posts.json; fi
          
          jq --arg t "$RAW_TITLE" --arg u "$SLUG" --arg d "$DATE" --arg m "$META" \
          '. = [{"title": $t, "url": $u, "meta_description": $m, "publish_date": $d}] + .' \
          omnnbc/data/posts.json > temp.json && mv temp.json omnnbc/data/posts.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add post: $RAW_TITLE"
          git push

      - name: Auto-Close Issue
        run: gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
