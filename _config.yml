# Tells GitHub to remove .html from URLs
permalink: /:title/
# లేదా ఇది ట్రై చేయండి
defaults:
  - scope:
      path: "posts"
    values:
      permalink: /:basename


# Tells GitHub NOT to process these files for the website
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - generate-sitemap.js
  - .github
