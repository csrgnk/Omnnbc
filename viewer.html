<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <style>
        body { font-family: sans-serif; background-color: #fffdf0; text-align: center; margin: 0; }
        .header { background: #C71585; color: white; padding: 20px; font-size: 24px; font-weight: bold; }
        .container { max-width: 800px; margin: 20px auto; padding: 25px; background: white; border: 1px solid #ddd; border-radius: 10px; line-height: 1.8; }
    </style>
</head>
<body>
    <div class="header">Namo Narayanaya Bhakthi Channel</div>
    <div class="container">
        <h1>{{ page.title }}</h1>
        <p>తేదీ: {{ page.date | date: "%d-%m-%Y" }}</p>
        <hr>
        {{ content }}
    </div>
</body>
</html>
