<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNNBC Admin Panel</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root { --primary: #C71585; --bg: #f9f9f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 850px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .editor-container { height: 350px; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tabs button { background: #555; font-size: 0.9rem; }
        #status { text-align: center; font-weight: bold; margin-top: 10px; color: #d63384; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-box">
        <h2 style="text-align:center">Admin Access</h2>
        <input type="password" id="passcode" placeholder="Secret Code">
        <input type="password" id="gh-token" placeholder="GitHub Personal Access Token">
        <button onclick="login()">Access Panel</button>
    </div>

    <div id="panel" class="hidden">
        <h2>Post Editor</h2>
        
        <select id="post-list" onchange="loadExistingPost()">
            <option value="">-- New Post (కొత్త పోస్ట్) --</option>
        </select>

        <input type="text" id="p-title" placeholder="Title: శ్రీ సూర్య సహస్రనామ స్తోత్రం">
        <input type="text" id="p-url" placeholder="Slug: sri-surya-sahasra-nama-stotram">
        <textarea id="p-desc" placeholder="Short Description..."></textarea>

        <div class="tabs">
            <button onclick="viewVisual()">Visual View</button>
            <button onclick="viewHTML()">HTML (Code) View</button>
        </div>

        <div id="visual-editor" class="editor-container"></div>
        <textarea id="html-editor" class="hidden editor-container" style="font-family: monospace;"></textarea>

        <button onclick="publish()">Publish / Update Post</button>
        <div id="status"></div>
    </div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    let quill = new Quill('#visual-editor', { theme: 'snow' });
    const REPO = "csrgnk/csrgnk.github.io";
    const BASE_PATH = "omnnbc"; // మీ ఫోల్డర్ పేరు
    let GITHUB_TOKEN = "";

    function login() {
        const code = document.getElementById('passcode').value;
        GITHUB_TOKEN = document.getElementById('gh-token').value;

        if(code === "Csr@4580" && GITHUB_TOKEN !== "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") {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('panel').classList.remove('hidden');
            fetchPostsJSON();
        } else {
            alert("Details Incomplete or Wrong!");
        }
    }

    function viewVisual() {
        document.getElementById('visual-editor').classList.remove('hidden');
        document.getElementById('html-editor').classList.add('hidden');
        quill.root.innerHTML = document.getElementById('html-editor').value;
    }

    function viewHTML() {
        document.getElementById('visual-editor').classList.add('hidden');
        document.getElementById('html-editor').classList.remove('hidden');
        document.getElementById('html-editor').value = quill.root.innerHTML;
    }

    async function fetchPostsJSON() {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${BASE_PATH}/data/posts.json`);
        const data = await res.json();
        const posts = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        const select = document.getElementById('post-list');
        posts.forEach(p => {
            let opt = document.createElement('option');
            opt.value = p.url;
            opt.innerText = p.title;
            select.appendChild(opt);
        });
    }

    async function loadExistingPost() {
        const slug = document.getElementById('post-list').value;
        if(!slug) return;
        
        document.getElementById('status').innerText = "Loading post...";
        const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/${BASE_PATH}/posts/${slug}.html`);
        const content = await res.text();
        quill.root.innerHTML = content;
        document.getElementById('p-url').value = slug;
        document.getElementById('status').innerText = "Post Loaded.";
    }

    async function publish() {
        const title = document.getElementById('p-title').value;
        const slug = document.getElementById('p-url').value;
        const desc = document.getElementById('p-desc').value;
        const content = quill.root.innerHTML;
        const date = new Date().toISOString().split('T')[0];

        if(!title || !slug) return alert("Title and URL are required!");

        document.getElementById('status').innerText = "Uploading to GitHub...";

        try {
            // 1. Save HTML
            await pushToGit(`${BASE_PATH}/posts/${slug}.html`, content, `Update Post: ${title}`);

            // 2. Update JSON
            const jsonMeta = await fetch(`https://api.github.com/repos/${REPO}/contents/${BASE_PATH}/data/posts.json`);
            const jsonData = await jsonMeta.json();
            let posts = JSON.parse(decodeURIComponent(escape(atob(jsonData.content))));

            // Update existing or add new
            posts = posts.filter(p => p.url !== slug);
            posts.unshift({ title, url: slug, publish_date: date, description: desc });

            await pushToGit(`${BASE_PATH}/data/posts.json`, JSON.stringify(posts, null, 2), `Update Index`, jsonData.sha);

            document.getElementById('status').innerText = "Success! Post Live.";
        } catch (err) {
            document.getElementById('status').innerText = "Error: " + err.message;
        }
    }

    async function pushToGit(path, content, msg, sha = null) {
        const body = {
            message: msg,
            content: btoa(unescape(encodeURIComponent(content))),
            branch: "main"
        };
        if(sha) body.sha = sha;

        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if(!res.ok) throw new Error("GitHub API Failed");
    }
</script>

</body>
</html>
