<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 320px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 20px 0; border: 2px solid #eee; border-radius: 12px; font-size: 24px; text-align: center; letter-spacing: 8px; box-sizing: border-box; }
        button { background: #C71585; color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:#C71585">OMNNBC Login</h2>
        <input type="password" id="pin" placeholder="••••" inputmode="numeric">
        <button onclick="login()">Enter Dashboard</button>
    </div>
    <script>
        function login() {
            if(document.getElementById('pin').value === "1234") { // Set your PIN here
                sessionStorage.setItem("admin_key", "active");
                window.location.href = "./admin-posts.html";
            } else { alert("Wrong PIN"); }
        }
    </script>
</body>
</html>
