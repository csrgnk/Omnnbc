<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNNBC | Admin Dashboard</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --primary: #C71585;
            --secondary: #f8f9fa;
            --accent: #FFD700;
            --text: #333;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e9ecef; 
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .hidden { display: none !important; }

        /* Login Card */
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            text-align: center;
            width: 100%;
            max-width: 350px;
        }

        /* Main Admin Card */
        .admin-card {
            background: white;
            width: 95%;
            max-width: 900px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            background: var(--primary);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h2 { margin: 0; font-size: 1.5rem; }

        .card-body { padding: 30px; }

        .input-group { margin-bottom: 20px; }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #555;
            font-size: 0.9rem;
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        input:focus { border-color: var(--primary); outline: none; }

        /* Editor Section */
        .editor-box {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .mode-switch {
            background: #f1f1f1;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .btn-mode {
            background: white;
            border: 1px solid #ccc;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-mode.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        #quill-editor { height: 350px; font-size: 1rem; }
        #html-output { 
            width: 100%; 
            height: 350px; 
            display: none; 
            font-family: 'Courier New', monospace; 
            padding: 15px; 
            border: none; 
            resize: none;
            box-sizing: border-box;
        }

        /* Submit Button */
        .btn-publish {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            transition: transform 0.2s, background 0.3s;
        }

        .btn-publish:hover { background: #a0106a; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div id="login-area" class="login-card">
        <h2 style="color: var(--primary);">Admin Login</h2>
        <p>Enter secret code to manage posts</p>
        <input type="password" id="passcode" placeholder="Secret Code">
        <button class="btn-publish" onclick="checkCode()">Unlock Dashboard</button>
    </div>

    <div id="admin-panel" class="admin-card hidden">
        <div class="card-header">
            <h2>OMNNBC Post Creator</h2>
            <span style="font-size: 0.8rem; opacity: 0.8;">v2.0 Beta</span>
        </div>

        <div class="card-body">
            <div class="input-group">
                <label>Post Title (Displays on Website)</label>
                <input type="text" id="post-title" placeholder="Example: Karunashtakalu 5th Ashtakam">
            </div>

            <label>Content Editor</label>
            <div class="editor-box">
                <div class="mode-switch">
                    <button id="btn-vis" class="btn-mode active" onclick="showVisual()">Visual Editor</button>
                    <button id="btn-html" class="btn-mode" onclick="showHTML()">HTML Code</button>
                </div>
                <div id="quill-editor"></div>
                <textarea id="html-output" placeholder="Paste your HTML code here..."></textarea>
            </div>

            <button class="btn-publish" onclick="submitToGitHub()">
                🚀 Generate Post & Update JSON
            </button>
            <p style="font-size: 0.8rem; color: #777; margin-top: 10px; text-align: center;">
                Clicking will open a GitHub Issue. Submit it to trigger the auto-publish workflow.
            </p>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const SECRET_CODE = "Namo123"; // Change this as needed
        var quill = new Quill('#quill-editor', { theme: 'snow' });

        function checkCode() {
            const val = document.getElementById('passcode').value;
            if(val === SECRET_CODE) {
                document.getElementById('login-area').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } else {
                alert("Access Denied!");
            }
        }

        function showVisual() {
            document.getElementById('quill-editor').style.display = 'block';
            document.getElementById('html-output').style.display = 'none';
            document.getElementById('btn-vis').classList.add('active');
            document.getElementById('btn-html').classList.remove('active');
            quill.root.innerHTML = document.getElementById('html-output').value;
        }

        function showHTML() {
            document.getElementById('quill-editor').style.display = 'none';
            document.getElementById('html-output').style.display = 'block';
            document.getElementById('btn-html').classList.add('active');
            document.getElementById('btn-vis').classList.remove('active');
            document.getElementById('html-output').value = quill.root.innerHTML;
        }

        function submitToGitHub() {
            const title = document.getElementById('post-title').value;
            const content = quill.root.innerHTML;
            const repo = "csrgnk/csrgnk.github.io";

            if(!title || content === "<p><br></p>") {
                alert("Please enter a title and some content!");
                return;
            }

            const issueTitle = `POST: ${title}`;
            const githubUrl = `https://github.com/${repo}/issues/new?title=${encodeURIComponent(issueTitle)}&body=${encodeURIComponent(content)}`;
            
            window.open(githubUrl, '_blank');
        }
    </script>
</body>
</html>
