<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | OMNNBC</title>
    <style>
        body { font-family: sans-serif; background: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #C71585; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="color:#C71585">OMNNBC Admin</h2>
        <input type="password" id="pass" placeholder="Enter Secret Code">
        <button onclick="login()">Login</button>
    </div>
    <script>
        function login() {
            if(document.getElementById('pass').value === "Namo123") {
                sessionStorage.setItem("admin_auth", "true");
                window.location.href = "admin-posts.html";
            } else { alert("Wrong Code"); }
        }
    </script>
</body>
</html>
